name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Project code and packages run here, with no way to sign or publish.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend and regenerate embedded assets
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain --untracked-files=all -- ../internal/boardweb/dist) {
            throw 'Embedded assets differ from the lockfile build. Run npm ci and npm run build in frontend, then commit the assets.'
          }
      # Every build carries the committed version resource and manifest; a
      # release stamps its own version into them first. -trimpath keeps the
      # build machine's folders out of the binary, so one commit builds to one
      # file wherever it is built.
      - name: Build
        shell: pwsh
        run: |
          Push-Location cmd/cfo
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64 --product-version ${{ github.ref_name }} --file-version ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          go build -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -o cfo.exe ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = (Get-Item cfo.exe).VersionInfo
          if ($info.ProductName -ne 'Code Goblins' -or $info.ProductVersion -ne '${{ github.ref_name }}') {
            throw "cfo.exe carries ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', want 'Code Goblins' and '${{ github.ref_name }}'"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build
          path: cfo.exe
          if-no-files-found: error
          retention-days: 1

  # Signing and publishing run no project code or package manager, so nothing
  # the build installs can reach the signing identity.
  publish:
    needs: build
    runs-on: windows-latest
    # The release environment holds the signing identity and admits only v*
    # tags, so nothing else can sign.
    environment: release
    permissions:
      contents: write
      # Azure sign-in through GitHub's OpenID Connect: no password is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            install.ps1
            tools/pin-installer.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-build
      # A release is signed or it is not published: without the signing
      # identity the job stops here, and no unsigned build ever ships.
      - name: Require the signing identity
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $names = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'SIGNING_PUBLISHER'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) { throw "Release signing is not set up in the release environment (missing: $($missing -join ', ')), so nothing is published." }
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\cfo.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Code Goblins
          description-url: https://github.com/${{ github.repository }}
      # cfo.exe must carry a valid, timestamped signature from the expected
      # publisher, checked two ways, or the release stops.
      - name: Verify the signature
        shell: pwsh
        env:
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe is not on this runner, so the signature cannot be verified and nothing is published." }
          $signature = Get-AuthenticodeSignature -FilePath cfo.exe
          if ($signature.Status -ne 'Valid') { throw "cfo.exe is not validly signed: $($signature.Status) $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne $env:SIGNING_PUBLISHER) { throw "cfo.exe is signed by '$($signature.SignerCertificate.Subject)', not '$env:SIGNING_PUBLISHER'" }
          if (-not $signature.TimeStamperCertificate) { throw "cfo.exe carries no timestamp, so its signature would lapse with the certificate" }
          & $signtool.FullName verify /pa /tw cfo.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed for cfo.exe with exit code $LASTEXITCODE" }
      # The signed file is scanned with Microsoft Defender on current
      # definitions. GitHub's Windows image turns real-time protection off and
      # excludes whole drives, where a scan passes without looking, so the job
      # turns protection back on and removes the exclusions first, and scans
      # only once Defender reports itself actively protecting with nothing
      # excluded. A runner where it does not, or a detection, stops the
      # release. The protection it ran under and what it found are published
      # as defender-scan.txt.
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $scanner)) { throw "Microsoft Defender is not on this runner, so the release cannot be scanned and nothing is published." }
          & $scanner -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender could not update its definitions (exit code $LASTEXITCODE), so the scan would not be current." }
          Set-MpPreference -DisableRealtimeMonitoring $false
          $preference = Get-MpPreference
          if ($preference.ExclusionPath) { Remove-MpPreference -ExclusionPath $preference.ExclusionPath }
          if ($preference.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $preference.ExclusionExtension }
          $status = Get-MpComputerStatus
          $preference = Get-MpPreference
          $record = @(
            "Microsoft Defender scan of this release's signed cfo.exe, on the GitHub runner that published it"
            "Running mode: $($status.AMRunningMode)"
            "Antivirus enabled: $($status.AntivirusEnabled)"
            "Real-time protection enabled: $($status.RealTimeProtectionEnabled)"
            "Path exclusions: $(@($preference.ExclusionPath).Where({ $_ }).Count)"
            "Extension exclusions: $(@($preference.ExclusionExtension).Where({ $_ }).Count)"
            "Product version: $($status.AMProductVersion)"
            "Engine version: $($status.AMEngineVersion)"
            "Antivirus definitions: $($status.AntivirusSignatureVersion), updated $($status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('u'))"
          )
          $record | Write-Host
          if ($status.AMRunningMode -ne 'Normal' -or -not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $preference.ExclusionPath -or $preference.ExclusionExtension) {
            throw "Microsoft Defender is not actively protecting this runner with nothing excluded, so its scan would prove nothing and nothing is published."
          }
          $scan = & $scanner -Scan -ScanType 3 -File (Resolve-Path cfo.exe).Path -DisableRemediation
          $scan | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Defender's scan of cfo.exe exited with code $LASTEXITCODE (2 is a detection), so nothing is published." }
          $record += "cfo.exe, SHA256 $((Get-FileHash cfo.exe -Algorithm SHA256).Hash.ToLowerInvariant()): $(@($scan).Where({ $_ -match 'found' }) -join ' ')"
          [IO.File]::WriteAllText("$PWD/defender-scan.txt", ($record -join "`n") + "`n")
      # install.ps1 refuses a download that does not match this file. The sum
      # is of the signed file, the one published.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash cfo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("SHA256SUMS", "$hash  cfo.exe`n")
      # The one-line install runs the install.ps1 published here, pinned to
      # this repository's release of this tag and to its publisher, so a
      # script change never outruns a release, a fork's installer never
      # downloads another repository's release, and a download it does not
      # see signed by that publisher is refused.
      - name: Pin the installer to this release
        shell: pwsh
        env:
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: ./tools/pin-installer.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -Publisher $env:SIGNING_PUBLISHER -Destination release/install.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cfo.exe
            SHA256SUMS
            defender-scan.txt
            release/install.ps1
