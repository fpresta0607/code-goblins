name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# The tag's name reaches every script through the environment alone, never
# in a script's text, where a name such as v1;<command> would run, and the
# build checks its shape before anything else.
env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # Project code and packages run here, with no way to sign or publish.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history and its tags, so the guard below can see main
          # hold the tag's commit, and find the last release.
          fetch-depth: 0
      # Pushing a tag needs only write access, and the release signs what it
      # builds, so only a tag of version shape on a commit main holds, newer
      # than the last release's, is built.
      - name: Release only a version from main
        shell: pwsh
        run: ./tools/release-on-main.ps1 -Tag $env:RELEASE_TAG -Commit $env:GITHUB_SHA -Main origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check and build the frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Where cfo.exe finds no board, it serves a page saying the board
          # was not built, so a release is built only over this build.
          if (-not (Test-Path ../internal/boardweb/dist/board/index.html)) {
            throw 'npm run build wrote no internal/boardweb/dist/board/index.html, which cfo.exe embeds the board from.'
          }
      - name: Check third-party licences
        run: go run ./tools/notices -check
      # Every build carries the committed version resource and manifest; a
      # release stamps its own version into them first, in every program but
      # the setup, as its comment below says. -trimpath keeps the
      # build machine's folders out of the binary, so one commit builds to one
      # file wherever it is built.
      - name: Build
        shell: pwsh
        run: |
          Push-Location cmd/cfo
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64 --product-version $env:RELEASE_TAG --file-version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          go build -trimpath -ldflags "-X main.version=$env:RELEASE_TAG" -o cfo.exe ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = (Get-Item cfo.exe).VersionInfo
          if ($info.ProductName -ne 'Code Goblins' -or $info.ProductVersion -ne $env:RELEASE_TAG) {
            throw "cfo.exe carries ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', want 'Code Goblins' and '$env:RELEASE_TAG'"
          }
          # The hook program is the same cfo built as a program with no
          # console: Claude Code starts each of a goblin's hooks hidden, which
          # gives a console program a console host of its own, a second
          # process for every hook, and a windowed one none.
          go build -trimpath -ldflags "-H windowsgui -X main.version=$env:RELEASE_TAG" -o cfo-hook.exe ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location cmd/goblins-window
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64 --product-version $env:RELEASE_TAG --file-version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # production: the released window has no developer tools and no
          # browser menu on a right click.
          go build -trimpath -tags production -ldflags "-H windowsgui" -o goblins-window.exe ./cmd/goblins-window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The desktop CI runner's service, which ci-runner-install.ps1
          # installs on a machine whose Overlord asks for it.
          go build -trimpath -o cg-ci-runner.exe ./cmd/cg-ci-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The setup carries nothing of the release: no version stamped into its
      # resources or code and no commit, so while its code is the same each
      # release builds it to the same file, which the publish job then
      # replaces with the last release's signed copy. It builds with the Go
      # release go.mod names, not the newest one setup-go installs for the
      # other programs, so a new Go release changes it only once go.mod is
      # bumped to it. It names the release it installs from the install
      # script it downloads. See docs/install.md for setup compatibility and
      # download behavior.
      - name: Build the setup
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = 'go' + (go list -m -f '{{.GoVersion}}')
          $version = go env GOVERSION
          if ($version -ne $env:GOTOOLCHAIN) {
            throw "The setup would build with Go '$version', not $env:GOTOOLCHAIN, the Go release go.mod names."
          }
          Write-Host "The setup builds with $version, the Go release go.mod names."
          go build -trimpath -buildvcs=false -tags production -ldflags "-H windowsgui -X main.repository=${{ github.repository }}" -o CodeGoblinsSetup.exe ./cmd/goblins-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The no-mistakes the fleet's gate needs, the build install.ps1 pins,
      # which the install takes from this release once this release signs it,
      # with the licences of everything compiled into it beside it.
      - name: Build no-mistakes
        shell: pwsh
        run: ./tools/build-no-mistakes.ps1 -Destination no-mistakes.exe -Notices no-mistakes-NOTICES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-build
          path: |
            cfo.exe
            cfo-hook.exe
            goblins-window.exe
            CodeGoblinsSetup.exe
            cg-ci-runner.exe
            no-mistakes.exe
            no-mistakes-NOTICES
          if-no-files-found: error
          retention-days: 1

  # Signing and publishing run no project code or package manager, so nothing
  # the build installs can reach the signing identity. The job leaves a draft:
  # a person reads it and publishes it, and no tag publishes by itself.
  publish:
    needs: build
    runs-on: windows-latest
    # The release environment holds the signing identity and admits only v*
    # tags, so nothing else can sign.
    environment: release
    permissions:
      contents: write
      # Azure sign-in through GitHub's OpenID Connect: no password is stored.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            install.ps1
            ci-runner-install.ps1
            tools/pin-installer.ps1
            LICENSE
            THIRD_PARTY_NOTICES
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-build
      # A release is signed where the release environment holds the signing
      # identity. Where it holds none, the release is unsigned and says so:
      # its notes and its installer name no publisher, and its SHA256SUMS is
      # what a download is checked against. Adding the identity to the
      # environment is all it takes to sign the next one. An identity that is
      # only partly there is a mistake, and stops the release rather than
      # letting it go out unsigned unnoticed.
      # A publisher label alone is not an Azure signing identity.
      - name: Look for the signing identity
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $names = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'SIGNING_PUBLISHER'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          $identityMissing = @($missing | Where-Object { $_ -ne 'SIGNING_PUBLISHER' })
          if ($missing.Count -eq 0) {
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          elseif ($identityMissing.Count -eq ($names.Count - 1)) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::The release environment holds no signing identity, so this release is unsigned and says so."
          }
          else {
            throw "Release signing is only partly set up in the release environment (missing: $($missing -join ', ')), so nothing is published."
          }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.signing.outputs.signed == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign
        if: steps.signing.outputs.signed == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\CodeGoblinsSetup.exe
            ${{ github.workspace }}\cfo.exe
            ${{ github.workspace }}\cfo-hook.exe
            ${{ github.workspace }}\goblins-window.exe
            ${{ github.workspace }}\cg-ci-runner.exe
            ${{ github.workspace }}\no-mistakes.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Code Goblins
          description-url: https://github.com/${{ github.repository }}
      # A setup whose code is the last release's is the file people already
      # downloaded, so the release publishes that signed copy again, and
      # SmartScreen's reputation for it grows with every download instead of
      # starting over with each release. The two are compared without the
      # bytes signing writes, the header's checksum and certificate entry and
      # the signature at the end, which differ with each signing. The copy is
      # checked below with the rest; a release with no earlier setup, one that
      # cannot download it, or one whose last setup is unsigned, which that
      # check would refuse, publishes its own.
      - name: Publish the last setup again while its code is the same
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-UnsignedHash([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            $optional = [BitConverter]::ToInt32($bytes, 0x3C) + 24
            if ([BitConverter]::ToUInt16($bytes, $optional) -ne 0x20B) { throw "$Path is not a 64-bit Windows program" }
            $checksum = $optional + 64
            $certificateEntry = $optional + 144
            $end = [BitConverter]::ToInt32($bytes, $certificateEntry)
            # A program with no certificate table is unsigned.
            if ($end -le 0) { return $null }
            $sha = [Security.Cryptography.SHA256]::Create()
            [void]$sha.TransformBlock($bytes, 0, $checksum, $null, 0)
            [void]$sha.TransformBlock($bytes, $checksum + 4, $certificateEntry - $checksum - 4, $null, 0)
            [void]$sha.TransformFinalBlock($bytes, $certificateEntry + 8, $end - $certificateEntry - 8)
            return [BitConverter]::ToString($sha.Hash)
          }
          $last = Join-Path $env:RUNNER_TEMP "last-setup"
          New-Item -ItemType Directory -Force -Path $last | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern CodeGoblinsSetup.exe --dir $last
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No earlier release's setup could be downloaded, so this release publishes its own."
            exit 0
          }
          $previous = Join-Path $last "CodeGoblinsSetup.exe"
          $lastHash = Get-UnsignedHash $previous
          if (-not $lastHash) {
            Write-Host "The last release's setup is unsigned, so this release publishes its own."
          }
          elseif ($lastHash -eq (Get-UnsignedHash "CodeGoblinsSetup.exe")) {
            Copy-Item -LiteralPath $previous -Destination "CodeGoblinsSetup.exe" -Force
            Write-Host "The setup's code is the last release's, so this release publishes that signed setup again."
          }
          else {
            Write-Host "The setup's code changed since the last release, so this release publishes its own."
          }
      # Each file must carry a valid, timestamped signature from the expected
      # publisher, checked two ways, or the release stops.
      - name: Verify the signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe is not on this runner, so the signatures cannot be verified and nothing is published." }
          foreach ($file in 'CodeGoblinsSetup.exe', 'cfo.exe', 'cfo-hook.exe', 'goblins-window.exe', 'cg-ci-runner.exe', 'no-mistakes.exe') {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.Status) $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne $env:SIGNING_PUBLISHER) { throw "$file is signed by '$($signature.SignerCertificate.Subject)', not '$env:SIGNING_PUBLISHER'" }
            if (-not $signature.TimeStamperCertificate) { throw "$file carries no timestamp, so its signature would lapse with the certificate" }
            & $signtool.FullName verify /pa /tw $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed for $file with exit code $LASTEXITCODE" }
          }
      # The files as published are scanned with Microsoft Defender on current
      # definitions. GitHub's Windows image turns real-time protection off and
      # excludes whole drives, where a scan passes without looking, so the job
      # turns protection back on and removes the exclusions first, and scans
      # only once Defender reports itself actively protecting with nothing
      # excluded. A runner where it does not, or a detection, stops the
      # release. The image also turns cloud-delivered protection off; turning
      # it on would send file data to Microsoft, so the job records it rather
      # than turning it on, and a clean scan here is not a cloud verdict. The
      # protection it ran under and what it found are published as
      # defender-scan.txt.
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $scanner)) { throw "Microsoft Defender is not on this runner, so the release cannot be scanned and nothing is published." }
          & $scanner -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender could not update its definitions (exit code $LASTEXITCODE), so the scan would not be current." }
          Set-MpPreference -DisableRealtimeMonitoring $false
          $preference = Get-MpPreference
          if ($preference.ExclusionPath) { Remove-MpPreference -ExclusionPath $preference.ExclusionPath }
          if ($preference.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $preference.ExclusionExtension }
          # Defender turns real-time protection on a few seconds after it is
          # asked to, so its status is read once it reports protection on, or
          # after a minute, when the check below stops the release.
          $deadline = (Get-Date).AddMinutes(1)
          while (-not (Get-MpComputerStatus).RealTimeProtectionEnabled -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          $status = Get-MpComputerStatus
          $preference = Get-MpPreference
          $record = @(
            "Microsoft Defender scan of this release's programs as published, on the GitHub runner that published it"
            "Running mode: $($status.AMRunningMode)"
            "Antivirus enabled: $($status.AntivirusEnabled)"
            "Real-time protection enabled: $($status.RealTimeProtectionEnabled)"
            "Path exclusions: $(@($preference.ExclusionPath).Where({ $_ }).Count)"
            "Extension exclusions: $(@($preference.ExclusionExtension).Where({ $_ }).Count)"
            "Product version: $($status.AMProductVersion)"
            "Engine version: $($status.AMEngineVersion)"
            "Antivirus definitions: $($status.AntivirusSignatureVersion), updated $($status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('u'))"
            "Cloud-delivered protection (MAPSReporting): $($preference.MAPSReporting)"
            "Sample submission (SubmitSamplesConsent): $($preference.SubmitSamplesConsent)"
            "Block at first sight disabled: $($preference.DisableBlockAtFirstSeen)"
            $(if ($preference.MAPSReporting -eq 0) { 'This scan used the local definitions only; it does not show a cloud verdict.' } else { 'This scan could consult cloud-delivered protection.' })
          )
          $record | Write-Host
          if ($status.AMRunningMode -ne 'Normal' -or -not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $preference.ExclusionPath -or $preference.ExclusionExtension) {
            throw "Microsoft Defender is not actively protecting this runner with nothing excluded, so its scan would prove nothing and nothing is published."
          }
          foreach ($file in 'CodeGoblinsSetup.exe', 'cfo.exe', 'cfo-hook.exe', 'goblins-window.exe', 'cg-ci-runner.exe', 'no-mistakes.exe') {
            $scan = & $scanner -Scan -ScanType 3 -File (Resolve-Path $file).Path -DisableRemediation
            $scan | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "Defender's scan of $file exited with code $LASTEXITCODE (2 is a detection), so nothing is published." }
            $record += "$file, SHA256 $((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()): $(@($scan).Where({ $_ -match 'found' }) -join ' ')"
          }
          [IO.File]::WriteAllText("$PWD/defender-scan.txt", ($record -join "`n") + "`n")
      # install.ps1 refuses a download that does not match this file. The
      # sums are of the files as published, after signing where they are
      # signed.
      - name: Checksum
        shell: pwsh
        run: |
          $lines = foreach ($file in 'CodeGoblinsSetup.exe', 'cfo.exe', 'cfo-hook.exe', 'goblins-window.exe', 'cg-ci-runner.exe', 'no-mistakes.exe') {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $file"
          }
          [IO.File]::WriteAllText("SHA256SUMS", ($lines -join "`n") + "`n")
      # The one-line install runs the install.ps1 published here, pinned to
      # this repository's release of this tag, so a script change never
      # outruns a release and a fork's installer never downloads another
      # repository's release. A signed release pins its publisher too, and a
      # download the script does not see signed by that publisher is refused;
      # an unsigned release names none, and its installer says that it checks
      # the release's SHA256SUMS only.
      - name: Pin the installer to this release
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          foreach ($source in 'install.ps1', 'ci-runner-install.ps1') {
            $pin = @{ Source = $source; Repository = $env:GITHUB_REPOSITORY; Tag = $env:GITHUB_REF_NAME; Destination = "release/$source" }
            if ($env:SIGNED -eq 'true') { $pin.Publisher = $env:SIGNING_PUBLISHER }
            # The runner's install takes the signed program's own SHA-256 as
            # its anchor, in the script the release signs next.
            if ($source -eq 'ci-runner-install.ps1') { $pin.ProgramHash = (Get-FileHash cg-ci-runner.exe -Algorithm SHA256).Hash }
            ./tools/pin-installer.ps1 @pin
          }
      # The install script is signed as the programs are, with the release's
      # own certificate, once it is pinned, since pinning rewrites it. An
      # unsigned script that downloads and runs programs is one Microsoft
      # Defender sends to Microsoft from every PC that meets it. The one-line
      # install runs the script as text, where the signature is a block of
      # comment lines at its end and changes nothing it does.
      - name: Sign the installer
        if: steps.signing.outputs.signed == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\release\install.ps1
            ${{ github.workspace }}\release\ci-runner-install.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Code Goblins
          description-url: https://github.com/${{ github.repository }}
      # The script must carry a valid, timestamped signature from the expected
      # publisher, and still be plain ASCII that parses, or the release stops:
      # a release download carries no charset, which Windows PowerShell reads
      # as Latin-1.
      - name: Verify the installer's signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          foreach ($script in 'release/install.ps1', 'release/ci-runner-install.ps1') {
            $signature = Get-AuthenticodeSignature -FilePath $script
            if ($signature.Status -ne 'Valid') { throw "$script is not validly signed: $($signature.Status) $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne $env:SIGNING_PUBLISHER) { throw "$script is signed by '$($signature.SignerCertificate.Subject)', not '$env:SIGNING_PUBLISHER'" }
            if (-not $signature.TimeStamperCertificate) { throw "$script carries no timestamp, so its signature would lapse with the certificate" }
            $text = [IO.File]::ReadAllText((Resolve-Path $script).Path)
            if ($text -match '[^\x00-\x7F]') { throw "$script has a character outside ASCII once it is signed" }
            $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$problems)
            if ($problems) { throw "$script no longer parses once it is signed: $($problems[0].Message)" }
          }
      # The notes open with what a person must know before trusting the
      # files: whether they are signed and by whom, and their sums.
      - name: Write the release notes
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $notes = @()
          if ($env:SIGNED -eq 'true') {
            $notes += "The programs of this release are code-signed by **$env:SIGNING_PUBLISHER**, and the install refuses a download that is not."
            $notes += "Its install script, ``install.ps1``, is signed by the same publisher."
          }
          else {
            $notes += "**This release is unsigned.** Code Goblins has no code-signing identity yet, so Windows knows these programs only as from an unknown publisher: a file saved with a browser gets SmartScreen's ""Windows protected your PC"", where **More info** and then **Run anyway** starts it, and Smart App Control, where it is on, blocks it."
            $notes += "You trust it by its SHA-256: the install refuses a download that does not match the sums below."
          }
          $notes += ''
          $notes += '| File | SHA-256 |'
          $notes += '| --- | --- |'
          foreach ($line in Get-Content SHA256SUMS) {
            $hash, $file = $line -split '\s+', 2
            $notes += "| ``$file`` | ``$hash`` |"
          }
          $notes += ''
          $notes += "To install, download ``CodeGoblinsSetup.exe`` from this page and open it. Or run this in PowerShell:"
          $notes += ''
          $notes += '```powershell'
          $notes += "irm https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1 | iex"
          $notes += '```'
          [IO.File]::WriteAllText("$PWD/release-notes.md", ($notes -join "`n") + "`n")
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          body_path: release-notes.md
          # GitHub's list of what changed follows the notes; the board's
          # Update item shows its first lines as what is new.
          generate_release_notes: true
          files: |
            CodeGoblinsSetup.exe
            cfo.exe
            cfo-hook.exe
            goblins-window.exe
            cg-ci-runner.exe
            no-mistakes.exe
            no-mistakes-NOTICES
            SHA256SUMS
            defender-scan.txt
            LICENSE
            THIRD_PARTY_NOTICES
            release/install.ps1
            release/ci-runner-install.ps1
