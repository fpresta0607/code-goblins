name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend and regenerate embedded assets
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain --untracked-files=all -- ../internal/boardweb/dist) {
            throw 'Embedded assets differ from the lockfile build. Run npm ci and npm run build in frontend, then commit the assets.'
          }
      # Every build carries the committed version resource and manifest; a
      # release stamps its own version into them first. -trimpath keeps the
      # build machine's folders out of the binary, so one commit builds to one
      # file wherever it is built.
      - name: Build
        shell: pwsh
        run: |
          Push-Location cmd/cfo
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64 --product-version ${{ github.ref_name }} --file-version ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          go build -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -o cfo.exe ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = (Get-Item cfo.exe).VersionInfo
          if ($info.ProductName -ne 'Code Goblins' -or $info.ProductVersion -ne '${{ github.ref_name }}') {
            throw "cfo.exe carries ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', want 'Code Goblins' and '${{ github.ref_name }}'"
          }
      # install.ps1 refuses a download that does not match this file.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash cfo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("SHA256SUMS", "$hash  cfo.exe`n")
      # The one-line install runs the install.ps1 published here, pinned to
      # this release's cfo.exe, so a script change never outruns a release.
      - name: Pin the installer to this release
        shell: pwsh
        run: |
          $latest = 'releases/latest/download"'
          $script = Get-Content -Raw install.ps1
          $found = ([regex]::Matches($script, [regex]::Escape($latest))).Count
          if ($found -ne 1) { throw "install.ps1 names $latest $found times, want once" }
          # A release download carries no charset, which Windows PowerShell
          # reads as Latin-1, so the script must stay plain ASCII.
          if ($script -match '[^\x00-\x7F]') { throw "install.ps1 has a character outside ASCII" }
          New-Item -ItemType Directory release | Out-Null
          [IO.File]::WriteAllText("$PWD/release/install.ps1", $script.Replace($latest, 'releases/download/${{ github.ref_name }}"'))
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cfo.exe
            SHA256SUMS
            release/install.ps1
