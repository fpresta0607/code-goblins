name: conpty-probe

# Temporary: reproduces the typed-keys terminal ending on the hosted runner's
# conhost and reads where conhost crashed. Runs only on a push to a probe
# branch.
on:
  push:
    branches: ['probe/conpty-*']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Keep conhost's crash dumps
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          (Get-Item "$env:WINDIR\System32\conhost.exe").VersionInfo.FileVersion
          (Get-FileHash "$env:WINDIR\System32\conhost.exe").Hash
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR
          New-Item -ItemType Directory -Force D:\dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-Item -Force "$wer\LocalDumps\conhost.exe" | Out-Null
          Set-ItemProperty "$wer\LocalDumps\conhost.exe" DumpFolder 'D:\dumps' -Type ExpandString
          Set-ItemProperty "$wer\LocalDumps\conhost.exe" DumpType 1 -Type DWord
          Set-ItemProperty "$wer\LocalDumps\conhost.exe" DumpCount 10 -Type DWord
          New-Item -Force "$wer\LocalDumps\OpenConsole.exe" | Out-Null
          Set-ItemProperty "$wer\LocalDumps\OpenConsole.exe" DumpFolder 'D:\dumps' -Type ExpandString
          Set-ItemProperty "$wer\LocalDumps\OpenConsole.exe" DumpType 1 -Type DWord
          Set-ItemProperty $wer Disabled 0 -Type DWord
          Set-ItemProperty $wer DontShowUI 1 -Type DWord
          Get-ItemProperty "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting" -ErrorAction SilentlyContinue | Format-List
          Set-Service WerSvc -StartupType Manual
          Start-Service WerSvc
          Get-Service WerSvc | Format-List Status, StartType
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue
      - name: Microsoft's ConPTY package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\conpty | Out-Null
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/1.25.260930003/microsoft.windows.console.conpty.1.25.260930003.nupkg -OutFile D:\conpty\conpty.zip
          Expand-Archive D:\conpty\conpty.zip D:\conpty\package
          Copy-Item D:\conpty\package\runtimes\win-x64\native\conpty.dll, D:\conpty\package\build\native\runtimes\x64\OpenConsole.exe D:\conpty\
          Get-ChildItem D:\conpty -File | ForEach-Object { "$($_.Name) $((Get-AuthenticodeSignature $_.FullName).Status)" }
      - name: Through OpenConsole, 1500 times
        continue-on-error: true
        shell: pwsh
        run: go test ./internal/conpty -run '^TestTypedKeysReachAProgramThatPrintsWhileItReads$' -count=1500 -timeout 35m
        env:
          CONPTY_PROBE_DLL: D:\conpty\conpty.dll
          CONPTY_PROBE_DUMPS: '1'
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state
      - name: Through the inbox conhost, 500 times
        continue-on-error: true
        shell: pwsh
        run: go test ./internal/conpty -run '^TestTypedKeysReachAProgramThatPrintsWhileItReads$' -count=500 -timeout 20m
        env:
          CONPTY_PROBE_DUMPS: '1'
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state
      - name: Where conhost crashed
        if: always()
        shell: pwsh
        run: |
          $dumps = @(Get-ChildItem D:\dumps -Filter *.dmp -ErrorAction SilentlyContinue)
          "$($dumps.Count) conhost dumps"
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          foreach ($dump in $dumps | Select-Object -First 4) {
            "===== $($dump.Name)"
            & $cdb -z $dump.FullName -y 'srv*C:\symbols*https://msdl.microsoft.com/download/symbols' -i 'C:\Windows\System32' -c '.reload /f conhost.exe; .reload /f ntdll.dll; .reload /f KERNELBASE.dll; .ecxr; .echo FRAMES; kn 30; .echo NEAREST; ln conhost+0x44808; .echo CODE; ub conhost+0x44808 L12; u conhost+0x44808 L4; .echo THREADS; ~*kn 12; q' 2>&1 | Select-String -Pattern 'FRAMES|NEAREST|CODE|THREADS|conhost!|ntdll!|KERNELBASE!|^ *[0-9a-f]{2} [0-9a-f]{8}`|^[0-9a-f]{8}`[0-9a-f]{8} ' | ForEach-Object { $_.Line } | Select-Object -First 160
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'conhost' } | Select-Object -First 4 | ForEach-Object { $_.Message }
