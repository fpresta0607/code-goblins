# PROBE, never merged. It runs only on a push to a branch under probe/, and
# times each leg of a typed key on a hosted runner (task cg-flaky-main-tests).
name: probe

on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  # The package as CI runs it, 70 times, by turns as main has the latency
  # test and with the fix. Every key of 20 ms or more is logged with where
  # its time went.
  natural:
    name: natural (${{ matrix.copy }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run the package by turns as main has it and with the fix
        shell: pwsh
        run: |
          for ($run = 1; $run -le 70; $run++) {
            if ($run % 2) { $env:PROBE_AS_MAIN = '1'; $mode = 'main' } else { $env:PROBE_AS_MAIN = ''; $mode = 'fix' }
            $output = go test ./internal/conpty -count=1 -v -timeout 20m | Out-String -Stream
            if ($LASTEXITCODE -eq 0) {
              "run $run ($mode) passed"
              $output | Select-String -Pattern 'natural|processors stood idle|^ok ' | ForEach-Object { "run $run ($mode): $($_.Line)" }
            } else {
              "run $run ($mode) FAILED"
              $output | Where-Object { $_ -notmatch '^=== ' } | ForEach-Object { "run $run ($mode): $_" }
            }
          }
          exit 0
        env:
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state

  # Keys beside a program that keeps every processor busy: the probe's own
  # typing as main runs it and raised, then the real latency test 25 times
  # each way.
  spin:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Type beside busy processors as main runs it
        shell: pwsh
        run: go test ./internal/conpty -run '^TestLatencyStages$' -count=1 -v -timeout 10m
        env:
          PROBE_STAGES_FOR: 2m
          PROBE_STAGES_SPIN_AFTER: 0s
      - name: Type beside busy processors with what is timed raised
        shell: pwsh
        run: go test ./internal/conpty -run '^TestLatencyStages$' -count=1 -v -timeout 10m
        env:
          PROBE_STAGES_FOR: 2m
          PROBE_STAGES_SPIN_AFTER: 0s
          PROBE_STAGES_HIGH: '1'
      - name: Run the latency test beside busy processors, 25 times each way
        shell: pwsh
        working-directory: internal/conpty
        run: |
          go test -c -o conpty.test.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spinner = Start-Process -FilePath .\conpty.test.exe -ArgumentList '-test.run=^TestLatencyStagesSpin$', '--', 'stages-spin', '20m' -WindowStyle Hidden -PassThru
          $failed = @{ main = 0; fix = 0 }
          for ($run = 1; $run -le 50; $run++) {
            if ($run % 2) { $env:PROBE_AS_MAIN = '1'; $mode = 'main' } else { $env:PROBE_AS_MAIN = ''; $mode = 'fix' }
            $output = .\conpty.test.exe '-test.run=^TestConsoleInputLatencyWhileIdleAndPrinting$' '-test.count=1' '-test.v' | Out-String -Stream
            if ($LASTEXITCODE -ne 0) { $failed[$mode]++; $verdict = 'FAILED' } else { $verdict = 'passed' }
            "run $run ($mode) $verdict"
            $output | Select-String -Pattern 'natural:|processors stood idle|latency_windows_test.go:\d+: key p95|no "' | ForEach-Object { "run $run ($mode): $($_.Line)" }
          }
          Stop-Process -Id $spinner.Id
          "beside busy processors: as main has it $($failed.main) of 25 failed, with the fix $($failed.fix) of 25 failed"
          exit 0
        env:
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state
