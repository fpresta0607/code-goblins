name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The work runs as parallel jobs so a run takes as long as its slowest job,
# not the sum: the frontend, each slow Go package, and every other Go package
# together. The test job at the end is the one check branch protection
# requires, and it passes only when every other job passed.
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend and regenerate embedded assets
        id: frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain --untracked-files=all -- ../internal/boardweb/dist) {
            throw 'Embedded assets differ from the lockfile build. Run npm ci and npm run build in frontend, then commit the assets.'
          }
      # Fails on a copyleft or unrecognised licence in anything a release
      # ships, or a THIRD_PARTY_NOTICES that no longer lists it. It reads the
      # packages npm ci installed above, so it runs in this job.
      - name: Check third-party licences
        run: go run ./tools/notices -check
      # A browser test that fails leaves its page snapshot (error-context.md)
      # and trace in test-results; keep them, so a failure seen once can be
      # read after the runner is gone.
      - name: Keep the browser tests' failure evidence
        if: failure() && steps.frontend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  go:
    name: go (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      # Every job runs to its end, so one run names every failure.
      fail-fast: false
      matrix:
        # A package slow enough to hold a run back gets jobs of its own. These
        # three spend their time waiting on real terminals and supervisors,
        # which no faster runner shortens, so each gets two: one runs the
        # tests whose names match run, the other skips exactly those. The
        # rest job runs every package that except does not name, so a new
        # package is tested with no change here.
        # TestGoWorkflowRunsEveryPackageOnce holds the matrix to that: except
        # names exactly the other jobs' packages, and a package in two jobs
        # is split by one pattern, run in one and skipped in the other.
        include:
          - shard: cmd-cfo-1
            packages: ./cmd/cfo
            run: Update|Recover
          - shard: cmd-cfo-2
            packages: ./cmd/cfo
            skip: Update|Recover
          - shard: spawn-1
            packages: ./internal/spawn
            run: Spawn
          - shard: spawn-2
            packages: ./internal/spawn
            skip: Spawn
          - shard: supervisor-1
            packages: ./internal/supervisor
            run: ^Test[A-M]
          - shard: supervisor-2
            packages: ./internal/supervisor
            skip: ^Test[A-M]
          - shard: rest
            except: ./cmd/cfo ./internal/spawn ./internal/supervisor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check the Windows resource objects
        if: matrix.shard == 'rest'
        shell: pwsh
        run: |
          foreach ($program in 'cmd/cfo', 'cmd/goblins-window', 'cmd/goblins-setup') {
            Push-Location $program
            go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64,arm64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (git status --porcelain --untracked-files=all -- rsrc_windows_amd64.syso rsrc_windows_arm64.syso) {
              throw "The resource objects differ from winres.json. In $program run go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64,arm64, then commit them."
            }
            Pop-Location
          }
      # Every job installs SQLite, not only the ones whose tests use it today:
      # a test that finds no sqlite3 skips itself, so a job without it would
      # pass having tested less.
      - name: Ensure SQLite integration tests can run
        shell: pwsh
        run: |
          # Chocolatey's feed can answer 503 for a moment, so a failed install
          # is tried again after a wait, three attempts in all, as install.ps1
          # does for its downloads.
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            for ($attempt = 1; ; $attempt++) {
              choco install sqlite --yes --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "choco install sqlite failed 3 times; see above" }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          sqlite3 --version
      - if: matrix.shard == 'rest'
        run: go vet ./...
      - name: Run Go tests with isolated CFO state
        # go test's default of 10 minutes a package left too little headroom
        # while one job ran every package at once: internal/spawn took 8
        # minutes there and the root package 11. With a runner to itself the
        # slowest, internal/supervisor, takes 5 whole, and the limit stays at
        # 20.
        shell: pwsh
        run: |
          if ($env:PACKAGES) {
            $packages = @(go list $env:PACKAGES.Split(' '))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $others = @(go list $env:EXCEPT.Split(' '))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @(go list ./... | Where-Object { $others -notcontains $_ })
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($packages.Count -eq 0) { throw 'This job found no package to test.' }
          $only = @()
          if ($env:RUN) { $only += '-run', $env:RUN }
          if ($env:SKIP) { $only += '-skip', $env:SKIP }
          go test $packages $only -count=1 -timeout 20m
        env:
          PACKAGES: ${{ matrix.packages }}
          EXCEPT: ${{ matrix.except }}
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state
      - if: matrix.shard == 'rest'
        run: go build ./cmd/cfo

  # The check branch protection requires. It runs whatever happened above,
  # and fails unless every job it needs succeeded: a job that failed, was
  # cancelled or was skipped is not a pass.
  test:
    if: always()
    needs: [frontend, go]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          $jobs = @(($env:RESULTS | ConvertFrom-Json).PSObject.Properties)
          $jobs | ForEach-Object { "$($_.Name): $($_.Value.result)" }
          $notPassed = @($jobs | Where-Object { $_.Value.result -ne 'success' })
          if ($jobs.Count -eq 0 -or $notPassed.Count -gt 0) {
            throw "Not every job passed: $($notPassed.Name -join ', ')"
          }
