name: go

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each group of pull requests on main's tip before it
  # merges them, and needs the required test check to report on that run.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # A newer commit on a pull request supersedes the run on the older one,
  # which is cancelled. Every other run, on main, in the merge queue or
  # started by hand, has a group of its own, so none is ever cancelled or
  # held waiting.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  # What can change the result of each job below. A merge train's run and a
  # run on main start every job. A pull request's own run starts the jobs its
  # change can alter, which the plan job reads from here (tools/ciplan):
  #
  # - frontend runs when a file under its paths changed, or the change
  #   reaches one of its packages: the embed check tests internal/boardweb
  #   and the licence check runs tools/notices, which reads the notices and
  #   the console host's licence.
  # - browser runs when a file under its paths changed: the board's own
  #   source, and the two files outside it that a spec reads.
  #   frontend/src/outside-reads.test.ts holds the list to what the specs
  #   read.
  # - a go job runs when the change reaches one of its packages: a package
  #   that changed, one that imports it, or one whose tests read a changed
  #   file under config/verify.json. The rest job runs when the change
  #   reaches any package at all, since it also vets and builds all of them.
  #
  # A change to a workflow, to config/verify.json, to tools/ciplan or a
  # package it imports, to go.mod or go.sum, or to a file the policy does not
  # account for starts every job: what the rule cannot be sure of widens the
  # run.
  #
  # Of the go jobs, a package slow enough to hold a run back gets jobs of its
  # own. These three spend their time waiting on real terminals and
  # supervisors, which no faster runner shortens, so each gets two: one runs
  # the tests whose names match run, the other skips exactly those.
  # internal/conpty is fast but times keystrokes against bounds: beside the
  # rest job's other packages, which keep all four cores busy, one key's echo
  # spent 429 ms waiting for a core, so it runs alone. The rest job runs
  # every package that except does not name, so a new package is tested with
  # no change here. TestGoWorkflowRunsEveryPackageOnce holds the list to
  # that: except names exactly the other jobs' packages, and a package in two
  # jobs is split by one pattern, run in one and skipped in the other.
  JOBS: |
    {
      "frontend": {
        "paths": ["frontend/**", "THIRD_PARTY_NOTICES", "internal/conpty/openconsole/LICENSE"],
        "packages": ["./internal/boardweb", "./tools/notices"]
      },
      "browser": {
        "paths": ["frontend/**", "internal/boardweb/dist/index.html", "cmd/goblins-window/notes.go"]
      },
      "go": [
        {"shard": "cmd-cfo-1", "packages": "./cmd/cfo", "run": "Update|Recover"},
        {"shard": "cmd-cfo-2", "packages": "./cmd/cfo", "skip": "Update|Recover"},
        {"shard": "spawn-1", "packages": "./internal/spawn", "run": "Spawn|Resume"},
        {"shard": "spawn-2", "packages": "./internal/spawn", "skip": "Spawn|Resume"},
        {"shard": "supervisor-1", "packages": "./internal/supervisor", "run": "^Test[A-M]"},
        {"shard": "supervisor-2", "packages": "./internal/supervisor", "skip": "^Test[A-M]"},
        {"shard": "conpty", "packages": "./internal/conpty"},
        {"shard": "rest", "except": "./cmd/cfo ./internal/spawn ./internal/supervisor ./internal/conpty"}
      ]
    }

# The work runs as parallel jobs so a run takes as long as its slowest job,
# not the sum: the frontend's checks, the board's browser tests in shards,
# each slow Go package, and every other Go package together. The plan job at
# the start says which of them this run starts. The test job at the end is
# the one check branch protection requires, and it passes only when every
# job the plan started passed.
jobs:
  plan:
    runs-on: windows-latest
    outputs:
      go: ${{ steps.plan.outputs.go }}
      frontend: ${{ steps.plan.outputs.frontend }}
      browser: ${{ steps.plan.outputs.browser }}
    env:
      # A pull request's own run, which may leave a job out. A merge train
      # tests its pull requests together from a branch named cfo/train-, on
      # whatever event, and that run and every other start every job, so
      # nothing reaches main that the full set did not test. The prefix is
      # the train's own (train.BranchPrefix), and
      # TestGoWorkflowKnowsATrainsRunByTheTrainsOwnBranchPrefix fails if this
      # line or the test job's ever names another.
      OWN_RUN: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'cfo/train-') }}
    steps:
      # The run's commit is the merge of the pull request into its base, so
      # its first parent is the base and the difference between the two is
      # what merging would change.
      - uses: actions/checkout@v6
        if: env.OWN_RUN == 'true'
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        if: env.OWN_RUN == 'true'
        with:
          go-version: stable
          cache: false
      - name: Choose the jobs this run starts
        id: plan
        shell: pwsh
        run: |
          if ($env:OWN_RUN -eq 'true') {
            go run ./tools/ciplan -base 'HEAD^1' >> $env:GITHUB_OUTPUT
            exit $LASTEXITCODE
          }
          'Every job runs: this is not a pull request''s own run.'
          $jobs = $env:JOBS | ConvertFrom-Json
          "go=$(ConvertTo-Json -InputObject @($jobs.go) -Compress)" >> $env:GITHUB_OUTPUT
          'frontend=true' >> $env:GITHUB_OUTPUT
          'browser=true' >> $env:GITHUB_OUTPUT

  frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # No cache of Go's modules and builds, here or in the go jobs, which
      # say why.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check and build the frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Where cfo.exe finds no board, it serves a page saying the board
          # was not built.
          if (-not (Test-Path ../internal/boardweb/dist/board/index.html)) {
            throw 'npm run build wrote no internal/boardweb/dist/board/index.html, which cfo.exe embeds the board from.'
          }
      # With the board built above, boardweb's tests prove cfo.exe embeds and
      # serves it rather than the placeholder page.
      - name: Check cfo.exe embeds the board
        run: go test ./internal/boardweb -count=1
      # Fails on a copyleft or unrecognised licence in anything a release
      # ships, or a THIRD_PARTY_NOTICES that no longer lists it. It reads the
      # packages npm ci installed above, so it runs in this job.
      - name: Check third-party licences
        run: go run ./tools/notices -check

  # The board's browser tests took 18 of a run's 20 minutes as one job, on
  # one worker, and grow with nearly every change to the board. Playwright
  # deals the spec files out by their number of tests, so each job runs its
  # share on a runner of its own, still on one worker, and every test runs in
  # exactly one job. The share is of strategy.job-total, so one more number
  # in the list is one more job and no test is left out.
  # TestGoWorkflowRunsEveryBrowserTestOnce holds the list to 1 up to its
  # length.
  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    strategy:
      # Every job runs to its end, so one run names every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run this job's share of the browser tests
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          # A test that fails runs once more (playwright.config.ts), and
          # tests/failed-once.ts appends each one that passed only then to
          # this record, under this job's name.
          FAILED_ONCE_JOB: browser (${{ matrix.shard }}/${{ strategy.job-total }})
          FAILED_ONCE_RECORD: ${{ runner.temp }}/failed-once.jsonl
      - name: Keep the record of each test that failed once
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-once-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/failed-once.jsonl
          if-no-files-found: ignore
          retention-days: 14
      # A browser test that fails leaves its page snapshot (error-context.md)
      # and trace in test-results, on its first try too when its second
      # passed; keep them, so a failure seen once can be read after the
      # runner is gone. A run in which nothing failed leaves only
      # Playwright's own note of its last run, which is not kept.
      - name: Keep the browser tests' failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            frontend/test-results
            !frontend/test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 14

  go:
    needs: plan
    if: needs.plan.outputs.go != '[]'
    name: go (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      # Every job runs to its end, so one run names every failure.
      fail-fast: false
      matrix:
        # The go jobs of JOBS above that the plan started.
        include: ${{ fromJSON(needs.plan.outputs.go) }}
    steps:
      - uses: actions/checkout@v6
      # setup-go keeps one cache for all of these jobs and the first to end
      # writes it, which is the conpty job, so it holds what that job needs
      # and little else: unpacking its 21 MB took 11 s in every job, which
      # then downloaded its own modules in under 2 s all the same.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Check the Windows resource objects
        if: matrix.shard == 'rest'
        shell: pwsh
        run: |
          foreach ($program in 'cmd/cfo', 'cmd/goblins-window', 'cmd/goblins-setup') {
            Push-Location $program
            go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64,arm64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (git status --porcelain --untracked-files=all -- rsrc_windows_amd64.syso rsrc_windows_arm64.syso) {
              throw "The resource objects differ from winres.json. In $program run go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64,arm64, then commit them."
            }
            Pop-Location
          }
      # Every job gets SQLite, not only the ones whose tests use it today: a
      # test that finds no sqlite3 skips itself, so a job without it would
      # pass having tested less. The fleet runs SQLite's own command line
      # program, so the tests need the program itself.
      #
      # It is the release pinned in the next step, kept in the Actions cache,
      # so a run asks no outside service for it. Chocolatey's feed used to
      # serve it to all eight jobs of every run: on 2026-10-10 it timed out
      # and answered 503 and 504 until the retries ran out, which failed two
      # jobs of run 38058158022 on main before any test ran. Only the first
      # run after the pin changes, or after a week in which no run used the
      # cache, fetches the release from sqlite.org.
      - name: Restore the pinned SQLite tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sqlite-tools.zip
          key: sqlite-tools-win-x64-3540000-63cb06e952a83fd1
      - name: Ensure SQLite integration tests can run
        shell: pwsh
        env:
          # To move the pin, take the new sqlite-tools-win-x64 zip and its
          # SHA3-256 from https://www.sqlite.org/download.html, check the
          # download against that, and write its SHA-256 here and the start
          # of it, with the version, in the cache key above.
          SQLITE_URL: https://www.sqlite.org/2026/sqlite-tools-win-x64-3540000.zip
          SQLITE_SHA256: 63cb06e952a83fd140139b008ed5b47496608161c62f8cd17bc96e8beb1de029
        run: |
          # The release is used only when it is the pinned one, whether the
          # cache or sqlite.org handed it over: a file with another SHA-256
          # is discarded and fetched again, three attempts in all with a wait
          # between them, as install.ps1 does for its downloads.
          $zip = Join-Path $env:RUNNER_TEMP sqlite-tools.zip
          for ($attempt = 1; ; $attempt++) {
            if (Test-Path -LiteralPath $zip) {
              $found = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
              if ($found -eq $env:SQLITE_SHA256) { break }
              "The SQLite tools at hand are not the pinned release: SHA-256 $found, want $env:SQLITE_SHA256."
              Remove-Item -LiteralPath $zip
            }
            if ($attempt -gt 3) { throw "No pinned SQLite tools after 3 attempts to fetch $env:SQLITE_URL; see above" }
            if ($attempt -gt 1) { Start-Sleep -Seconds (5 * ($attempt - 1)) }
            try {
              Invoke-WebRequest -Uri $env:SQLITE_URL -OutFile $zip -TimeoutSec 60
            } catch {
              "Attempt $attempt to fetch $env:SQLITE_URL failed: $_"
            }
          }
          $tools = Join-Path $env:RUNNER_TEMP sqlite-tools
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          # For the steps after this one, and for this one, which proves the
          # program runs as the tests will find it.
          $tools >> $env:GITHUB_PATH
          $env:PATH = "$tools;$env:PATH"
          sqlite3 --version
      - if: matrix.shard == 'rest'
        run: go vet ./...
      - name: Run Go tests with isolated CFO state
        # go test's default of 10 minutes a package left too little headroom
        # while one job ran every package at once: internal/spawn took 8
        # minutes there and the root package 11. With a runner to itself the
        # slowest, internal/supervisor, takes 5 whole, and the limit stays at
        # 20.
        shell: pwsh
        run: |
          if ($env:PACKAGES) {
            $packages = @(go list $env:PACKAGES.Split(' '))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $others = @(go list $env:EXCEPT.Split(' '))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @(go list ./... | Where-Object { $others -notcontains $_ })
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($packages.Count -eq 0) { throw 'This job found no package to test.' }
          # tools/citest runs go test -count=1 on the packages, and runs a
          # test that failed once more, by its name: one that passes then is
          # kept in the record and the job passes, and one that fails twice
          # fails the job.
          $citest = Join-Path $env:RUNNER_TEMP citest.exe
          go build -o $citest ./tools/citest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $citest -job "go ($env:SHARD)" -record (Join-Path $env:RUNNER_TEMP failed-once.jsonl) "-run=$env:RUN" "-skip=$env:SKIP" -timeout 20m $packages
        env:
          SHARD: ${{ matrix.shard }}
          PACKAGES: ${{ matrix.packages }}
          EXCEPT: ${{ matrix.except }}
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state
      - name: Keep the record of each test that failed once
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-once-go-${{ matrix.shard }}
          path: ${{ runner.temp }}/failed-once.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - if: matrix.shard == 'rest'
        run: go build ./cmd/cfo

  # The check branch protection requires. It runs whatever happened above,
  # and fails unless the plan succeeded and every job it started succeeded: a
  # job that failed or was cancelled is not a pass, and neither is one that
  # was skipped unless the plan left it out. Only a pull request's own run
  # may leave a job out: in a merge train's run and every other, a job that
  # did not succeed fails the check whatever the plan said.
  test:
    if: always()
    needs: [plan, frontend, browser, go]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
          OWN_RUN: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'cfo/train-') }}
        run: |
          $needs = $env:RESULTS | ConvertFrom-Json
          $jobs = @($needs.PSObject.Properties)
          $jobs | ForEach-Object { "$($_.Name): $($_.Value.result)" }
          $plan = $needs.plan
          # What the plan left out, which only a plan that succeeded and said
          # true or false for each job can say.
          $leftOut = @()
          if ($env:OWN_RUN -eq 'true' -and $plan.result -eq 'success') {
            $said = $plan.outputs
            if ($said.frontend -notin 'true', 'false' -or $said.browser -notin 'true', 'false' -or "$($said.go)" -notmatch '^\[.*\]$') {
              throw "The plan did not say which jobs to start: frontend '$($said.frontend)', browser '$($said.browser)', go '$($said.go)'"
            }
            if ($said.frontend -eq 'false') { $leftOut += 'frontend' }
            if ($said.browser -eq 'false') { $leftOut += 'browser' }
            if ($said.go -eq '[]') { $leftOut += 'go' }
            "left out by the plan: $($leftOut -join ', ')"
          }
          $notPassed = @($jobs | Where-Object { $_.Value.result -ne 'success' -and -not ($_.Value.result -eq 'skipped' -and $leftOut -contains $_.Name) })
          if ($jobs.Count -eq 0 -or $notPassed.Count -gt 0) {
            throw "Not every job passed: $($notPassed.Name -join ', ')"
          }
      # A test that failed and passed on its second try left its job green.
      # Each is named here, on the check a pull request requires, as a
      # warning titled Failed once that says job: suite test, so a failure by
      # chance is counted and never hidden. gh run view prints each one
      # without its title, so each says what happened in full, and they are
      # on the page of the run and in its summary.
      - name: Fetch the record of each test that failed once
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: failed-once-*
          path: failed-once
      - name: Name each test that failed once
        if: always()
        shell: pwsh
        run: |
          $records = @(Get-ChildItem -Path failed-once -Filter *.jsonl -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object FullName | ForEach-Object { Get-Content -LiteralPath $_.FullName } |
            Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
          if ($records.Count -eq 0) {
            'No test failed once in this run.'
            exit 0
          }
          $named = @($records | ForEach-Object { "$($_.job): $($_.suite) $($_.test) failed once and passed on the second try" })
          $named
          # GitHub shows ten warnings of one step, so the tenth says how many
          # more this log names.
          $shown = if ($named.Count -gt 10) { 9 } else { $named.Count }
          foreach ($name in $named[0..($shown - 1)]) {
            "::warning title=Failed once::$($name.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))"
          }
          if ($named.Count -gt $shown) {
            "::warning title=Failed once::and $($named.Count - $shown) more, named in the log of this step"
          }
          $summary = @('### Failed once', '') + @($named | ForEach-Object { "- $_" })
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
