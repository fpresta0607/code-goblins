name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The work runs as parallel jobs so a run takes as long as its slowest job,
# not the sum: the frontend, each slow Go package alone, and every other Go
# package together. The test job at the end is the one check branch
# protection requires, and it passes only when every other job passed.
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend and regenerate embedded assets
        id: frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain --untracked-files=all -- ../internal/boardweb/dist) {
            throw 'Embedded assets differ from the lockfile build. Run npm ci and npm run build in frontend, then commit the assets.'
          }
      # A browser test that fails leaves its page snapshot (error-context.md)
      # and trace in test-results; keep them, so a failure seen once can be
      # read after the runner is gone.
      - name: Keep the browser tests' failure evidence
        if: failure() && steps.frontend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  go:
    name: go (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      # Every job runs to its end, so one run names every failure.
      fail-fast: false
      matrix:
        # A package slow enough to hold a run back gets a job of its own. The
        # rest job runs every package that except does not name, so a new
        # package is tested with no change here; except must name exactly the
        # other jobs' packages, which TestGoWorkflowRunsEveryPackageOnce
        # checks.
        include:
          - shard: root
            packages: .
          - shard: cmd-cfo
            packages: ./cmd/cfo
          - shard: spawn
            packages: ./internal/spawn
          - shard: supervisor
            packages: ./internal/supervisor
          - shard: installtest
            packages: ./internal/installtest
          - shard: rest
            except: . ./cmd/cfo ./internal/spawn ./internal/supervisor ./internal/installtest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check the Windows resource objects
        if: matrix.shard == 'rest'
        working-directory: cmd/cfo
        shell: pwsh
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64,arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain --untracked-files=all -- rsrc_windows_amd64.syso rsrc_windows_arm64.syso) {
            throw 'The resource objects differ from winres.json. In cmd/cfo run go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64,arm64, then commit them.'
          }
      # Every job installs SQLite, not only the ones whose tests use it today:
      # a test that finds no sqlite3 skips itself, so a job without it would
      # pass having tested less.
      - name: Ensure SQLite integration tests can run
        shell: pwsh
        run: |
          # Chocolatey's feed can answer 503 for a moment, so a failed install
          # is tried again after a wait, three attempts in all, as install.ps1
          # does for its downloads.
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            for ($attempt = 1; ; $attempt++) {
              choco install sqlite --yes --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "choco install sqlite failed 3 times; see above" }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          sqlite3 --version
      - if: matrix.shard == 'rest'
        run: go vet ./...
      - name: Run Go tests with isolated CFO state
        # go test's default of 10 minutes a package left too little headroom
        # here: internal/spawn takes about 6.5 minutes on this runner, and the
        # root package reached the limit before its repeated installs were
        # cut. 20 minutes is about three times the slowest package.
        shell: pwsh
        run: |
          if ($env:PACKAGES) {
            $packages = @(go list $env:PACKAGES.Split(' '))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $others = @(go list $env:EXCEPT.Split(' '))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @(go list ./... | Where-Object { $others -notcontains $_ })
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($packages.Count -eq 0) { throw 'This job found no package to test.' }
          go test $packages -json -count=1 -timeout 20m > "$env:RUNNER_TEMP\go-test.json"
        env:
          PACKAGES: ${{ matrix.packages }}
          EXCEPT: ${{ matrix.except }}
          CFO_HOME: ${{ runner.temp }}\cfo-go-tests
          CFO_STATE_OVERRIDE: ${{ runner.temp }}\cfo-go-tests\state
      # Measurement only, removed before merge: every test this job ran, with
      # its time, to compare with the single job.
      - name: Keep the test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-inventory-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test.json
          retention-days: 14
      - if: matrix.shard == 'rest'
        run: go build ./cmd/cfo

  # The check branch protection requires. It runs whatever happened above,
  # and fails unless every job it needs succeeded: a job that failed, was
  # cancelled or was skipped is not a pass.
  test:
    if: always()
    needs: [frontend, go]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          $jobs = @(($env:RESULTS | ConvertFrom-Json).PSObject.Properties)
          $jobs | ForEach-Object { "$($_.Name): $($_.Value.result)" }
          $notPassed = @($jobs | Where-Object { $_.Value.result -ne 'success' })
          if ($jobs.Count -eq 0 -or $notPassed.Count -gt 0) {
            throw "Not every job passed: $($notPassed.Name -join ', ')"
          }
