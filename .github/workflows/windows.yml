name: windows

# Proves on a hosted runner's desktop what no test may show on a person's:
# that no console window a fleet process opens stays on the desktop. A
# careless start of cfo gate turn, a goblin's background run, opens a window
# with the last main's build before the fix and closes it at once with this
# commit's, cfo gate turn
# --detach opens none, and the supervisor's backstop takes a careless
# console off the desktop. Each runs twice, with the console host and with
# Windows Terminal as the default terminal, which the runner's image has
# installed. The tests that show a window run only here, where
# CFO_WINDOW_PROOF names the default terminal.
on:
  # A draft runs nothing but the draft job, and marking it ready runs the
  # proof on its head, as the go workflow does.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - cmd/cfo/main.go
      - cmd/cfo/own_console*.go
      - cmd/cfo/gate_turn*.go
      - cmd/cfo/launcher.go
      - internal/execx/**
      - internal/proc/**
      - internal/supervisor/console_window*.go
      - tests/acceptance/no_visible_windows.ps1
      - .github/workflows/windows.yml

permissions:
  contents: read

concurrency:
  # A newer commit on a pull request supersedes the run on the older one,
  # which is cancelled. A run whose event saw a draft has a group apart from
  # the one of runs whose event saw the pull request ready, so neither
  # cancels the other, as in the go workflow.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}{1}', github.event.pull_request.number, github.event.pull_request.draft && '-draft' || '') || github.run_id }}
  cancel-in-progress: true

jobs:
  # A run whose event saw a draft asks GitHub whether the pull request is a
  # draft now, as the go workflow's does, and the proof runs unless it still is.
  draft:
    # The check this job makes tests nothing, and every reader of a head's
    # checks passes over it by this name (train.DraftStateCheck).
    name: draft state
    if: github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.read.outputs.draft }}
    steps:
      - name: Read whether the pull request is a draft now
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: repos/${{ github.repository }}/pulls/${{ github.event.number }}
        run: |
          draft=$(gh api "$PULL_REQUEST" --jq .draft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows' console host, and Windows Terminal, by the class ids
          # Windows' default terminal setting stores.
          - terminal: the console host
            console: '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}'
            host: '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}'
          - terminal: Windows Terminal
            console: '{2EACA947-7F5F-4CFA-BA87-8F7FBEEFBE69}'
            host: '{E12CFF52-A866-4C77-9A90-F570A7AA2C6B}'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # The proof needs a build that still shows a careless start's window.
      # Since PR 818 landed the fix, main hides it too, so a baseline built
      # from origin/main failed the proof's own premise on every pull request
      # this workflow ran on. The baseline is pinned to 9c0042229, the first
      # parent of 818's merge and the last main without the fix. The proof
      # still names that build main.
      - name: Build cfo from the last main without the fix and from this commit
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\branch\cfo.exe" ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add "$env:RUNNER_TEMP\main-source" 9c004222974af7e5b751c55953450f2324dd5f7f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C "$env:RUNNER_TEMP\main-source" build -o "$env:RUNNER_TEMP\main\cfo.exe" ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Make ${{ matrix.terminal }} the default terminal
        shell: pwsh
        run: |
          New-Item -Force 'HKCU:\Console\%%Startup' | Out-Null
          Set-ItemProperty 'HKCU:\Console\%%Startup' DelegationConsole '${{ matrix.console }}'
          Set-ItemProperty 'HKCU:\Console\%%Startup' DelegationTerminal '${{ matrix.host }}'
          Get-AppxPackage Microsoft.WindowsTerminal | Select-Object Name, Version | Out-String
      - name: Run the tests that show a window
        shell: pwsh
        env:
          CFO_WINDOW_PROOF: ${{ matrix.terminal }}
        run: |
          go test ./cmd/cfo -run '^(TestACommandStartedAloneInANewConsoleClosesItsWindow|TestIsShownOnPurposeKeepsOnlyWhatTheOverlordStartsToLookAt|TestGateTurnDetachStartsTheRunHiddenWithItsPidAndLog)$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/supervisor -run '^(TestHideConsoleOnDesktopTakesACarelessConsoleOffTheDesktop|TestHideConsoleOnDesktopHidesNothingOfAConsoleWithNoWindow)$' -count=5 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure each careless start and a detached run
        shell: powershell
        run: .\tests\acceptance\no_visible_windows.ps1 -BaseCfo "$env:RUNNER_TEMP\main\cfo.exe" -Cfo "$env:RUNNER_TEMP\branch\cfo.exe" -Terminal '${{ matrix.terminal }}' -Work "$env:RUNNER_TEMP\proof"
