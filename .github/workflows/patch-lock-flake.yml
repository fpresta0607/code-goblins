name: patch-lock-flake

on:
  push:
    branches: [fix/lock-test-clock-flake]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-lock-flake]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/lock-test-clock-flake
      - name: Replace clock-sensitive assertion
        shell: pwsh
        run: |
          $path = 'internal/lock/lock_test.go'
          $lines = [System.Collections.Generic.List[string]](Get-Content $path)
          $needle = "`tif second.Acquired.Equal(first.Acquired) {"
          $start = $lines.IndexOf($needle)
          if ($start -lt 0) { throw 'clock-sensitive assertion not found' }
          if ($lines[$start + 2] -ne "`t}") { throw 'unexpected assertion shape' }
          $lines.RemoveRange($start, 3)
          $replacement = [string[]]@(
            "`tcurrent, err := ReadNamed(dir, name)",
            "`tif err != nil {",
            "`t`tFatalf(`"ReadNamed reclaimed lock: %v`", err)",
            "`t}",
            "`tif current.PID != second.PID || current.OwnerPID != second.OwnerPID || current.Session != second.Session || !current.Start.Equal(second.Start) || current.Hostname != second.Hostname || !current.Acquired.Equal(second.Acquired) {",
            "`t`tFatalf(`"reclaimed holder = %+v, want second lease %+v`", current, second)",
            "`t}"
          )
          for ($i = $replacement.Length - 1; $i -ge 0; $i--) { $lines.Insert($start, $replacement[$i]) }
          [IO.File]::WriteAllLines($path, $lines, [Text.UTF8Encoding]::new($false))
          gofmt -w $path
          go test ./internal/lock -run TestAcquireExclusiveNamedReclaimsAbandonedLeaseAfterReleaseFailure -count=100
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Code Goblins CI"
          git config user.email "actions@users.noreply.github.com"
          git add internal/lock/lock_test.go
          git commit -m "test: remove clock-resolution flake [patched-lock-flake]"
          git push origin HEAD:fix/lock-test-clock-flake
