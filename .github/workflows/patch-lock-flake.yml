name: patch-lock-flake

on:
  push:
    branches: [fix/lock-test-clock-flake]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-lock-flake]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/lock-test-clock-flake
      - name: Replace clock-sensitive assertion
        shell: pwsh
        run: |
          $path = 'internal/lock/lock_test.go'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = "`tif second.Acquired.Equal(first.Acquired) {`n`t`t.Fatalf(`"reclaimed lease retained first acquisition time: first=%s second=%s`", first.Acquired, second.Acquired)`n`t}`n"
          $new = "`tcurrent, err := ReadNamed(dir, name)`n`tif err != nil {`n`t`t.Fatalf(`"ReadNamed reclaimed lock: %v`", err)`n`t}`n`tif current.PID != second.PID || current.OwnerPID != second.OwnerPID || current.Session != second.Session || !current.Start.Equal(second.Start) || current.Hostname != second.Hostname || !current.Acquired.Equal(second.Acquired) {`n`t`t.Fatalf(`"reclaimed holder = %+v, want second lease %+v`", current, second)`n`t}`n"
          if (-not $text.Contains($old)) { throw 'expected clock-sensitive assertion not found' }
          $updated = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
          gofmt -w $path
          go test ./internal/lock -run TestAcquireExclusiveNamedReclaimsAbandonedLeaseAfterReleaseFailure -count=100
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Code Goblins CI"
          git config user.email "actions@users.noreply.github.com"
          git add internal/lock/lock_test.go
          git commit -m "test: remove clock-resolution flake [patched-lock-flake]"
          git push origin HEAD:fix/lock-test-clock-flake
