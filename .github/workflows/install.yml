name: install

# Proves the installs on a clean Windows user profile, which a GitHub-hosted
# runner is by construction: the one-line install, with this commit's own
# build served as the release and installed exactly as `irm ... | iex` would,
# the setup program's install of that same release, and `.\install.cmd -Dev`
# from this checkout. Each ends with the installed home's dictation proven
# ready, or, where the runner could not download the model, recorded as an
# environment result. It also proves the update a person who installed a
# published release makes to this commit's build with goblins update.
on:
  # A draft runs nothing but the draft job, and marking it ready runs both
  # installs on its head, as the go workflow does.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - install.ps1
      - install.cmd
      - tools/build-no-mistakes.ps1
      - home_files.go
      - cmd/goblins/install.go
      - cmd/goblins/launcher.go
      - cmd/goblins/serve.go
      - cmd/goblins/native.go
      - cmd/goblins/main.go
      - cmd/goblins/doctor.go
      - cmd/goblins/dictation.go
      - cmd/goblins/crawler.go
      - cmd/goblins-setup/**
      - config/voice.json
      - internal/voice/**
      - internal/crawler/**
      - connectors/crawler/**
      - internal/home/**
      - internal/install/**
      - internal/installbase/**
      - internal/nativehook/**
      - internal/doctor/**
      - internal/uninstall/**
      - cmd/goblins/uninstall.go
      - tools/leftovers/**
      - tests/uninstall/**
      - tests/update/**
      - cmd/goblins/update.go
      - cmd/goblins/update_release.go
      - internal/release/**
      - internal/update/**
      - cmd/goblins/cutover.go
      - internal/cutover/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - install.ps1
      - install.cmd
      - tools/build-no-mistakes.ps1
      - home_files.go
      - cmd/goblins/install.go
      - cmd/goblins/launcher.go
      - cmd/goblins/serve.go
      - cmd/goblins/native.go
      - cmd/goblins/main.go
      - cmd/goblins/doctor.go
      - cmd/goblins/dictation.go
      - cmd/goblins/crawler.go
      - cmd/goblins-setup/**
      - config/voice.json
      - internal/voice/**
      - internal/crawler/**
      - connectors/crawler/**
      - internal/home/**
      - internal/install/**
      - internal/installbase/**
      - internal/nativehook/**
      - internal/doctor/**
      - internal/uninstall/**
      - cmd/goblins/uninstall.go
      - tools/leftovers/**
      - tests/uninstall/**
      - tests/update/**
      - cmd/goblins/update.go
      - cmd/goblins/update_release.go
      - internal/release/**
      - internal/update/**
      - cmd/goblins/cutover.go
      - internal/cutover/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  # A merge queue run checks both installs too. GitHub applies no path
  # filter to it, so every queued group runs them.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      release:
        description: Install the latest published release instead of this commit's build
        type: boolean
        default: false

concurrency:
  # A newer commit on a pull request supersedes the run on the older one,
  # which is cancelled. A run whose event saw a draft has a group apart from
  # the one of runs whose event saw the pull request ready, so neither
  # cancels the other, as in the go workflow. Every other run, on main, in
  # the merge queue or started by hand, has a group of its own, so none is
  # ever cancelled or held waiting.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}{1}', github.event.pull_request.number, github.event.pull_request.draft && '-draft' || '') || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A run whose event saw a draft asks GitHub whether the pull request is a
  # draft now, as the go workflow's does, and the installs run unless it still is.
  draft:
    # The check this job makes tests nothing, and every reader of a head's
    # checks passes over it by this name (train.DraftStateCheck).
    name: draft state
    if: github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.read.outputs.draft }}
    steps:
      - name: Read whether the pull request is a draft now
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: repos/${{ github.repository }}/pulls/${{ github.event.number }}
        run: |
          draft=$(gh api "$PULL_REQUEST" --jq .draft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  # A push to main runs neither install when a pull request run of this
  # workflow passed on the push's exact tree and first parent, as a merge
  # train's run does for the tree the train lands unchanged
  # (tools/pushreuse). Any other push, and one whose records cannot be read,
  # runs both. A release builds and installs in its own workflow.
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        continue-on-error: true
      - uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: stable
          cache: false
      - name: Find a pull request run that passed this tree on this main
        id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/pushreuse find install.yml >> "$GITHUB_OUTPUT"

  one-line:
    # The setup program runs the install script in Windows PowerShell, out of
    # sight, as CodeGoblinsSetup.exe does once Install is pressed.
    name: ${{ matrix.via }} (${{ matrix.shell }})
    needs: [draft, reuse]
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' && needs.reuse.outputs.run == '' }}
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        via: [one-line]
        include:
          - shell: powershell
            via: setup
    runs-on: windows-latest
    # The bootstrap runs third-party installers; one that waits for input
    # fails the job instead of holding the runner for hours.
    timeout-minutes: 30
    # A step's own shell cannot read the matrix; the job's run default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        if: ${{ !inputs.release }}
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Serve this commit as the release
        if: ${{ !inputs.release }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          # goblins.exe embeds the board, which a release builds first.
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o release/goblins.exe ./cmd/goblins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The no-mistakes a release publishes beside goblins.exe, built from
          # the commit install.ps1 pins, as the release builds it.
          ./tools/build-no-mistakes.ps1 -Destination release/no-mistakes.exe
          $lines = foreach ($file in 'goblins.exe', 'no-mistakes.exe') {
            "$((Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLowerInvariant())  $file"
          }
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS", ($lines -join "`n") + "`n")
          # The setup program downloads the release's own install script.
          Copy-Item install.ps1 release/install.ps1
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "release" -WindowStyle Hidden
          # The next step downloads at once, so wait until the server answers.
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            try { Invoke-WebRequest http://127.0.0.1:8765/SHA256SUMS -UseBasicParsing | Out-Null; break }
            catch { if ((Get-Date) -gt $deadline) { throw "the release server did not answer within 30 seconds" }; Start-Sleep -Milliseconds 250 }
          }
      - name: Snapshot the profile before the install
        shell: pwsh
        run: |
          # What the uninstall at the end is compared with: the profile and
          # the machine as they are before Code Goblins is installed.
          go build -o "$env:RUNNER_TEMP\leftovers.exe" ./tools/leftovers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The person's own checkout, which the goblin works in, is theirs
          # before Code Goblins is installed and stays theirs after.
          # A clone, as a person's checkout is, of a repository beside it,
          # since a goblin's worktree starts from origin's default branch.
          $origin = Join-Path $env:USERPROFILE "source\demo-origin.git"
          $seed = Join-Path $env:RUNNER_TEMP "demo-seed"
          git init -q --bare -b main $origin
          git init -q -b main $seed
          Set-Content -LiteralPath (Join-Path $seed "README.md") -Value "demo"
          git -C $seed add README.md
          git -C $seed -c user.name=Person -c user.email=person@example.invalid commit -q -m "first"
          git -C $seed push -q $origin main
          $project = Join-Path $env:USERPROFILE "source\demo"
          git clone -q $origin $project
          # npm keeps the tools it installs globally where it is told,
          # outside the profile on a runner, so the snapshots read it too.
          $npmPrefix = (npm prefix --global) | Select-Object -Last 1
          # The install takes a ~\.no-mistakes it finds for the person's
          # own, which the uninstall keeps, so the comparison proves what the
          # uninstall does with it only on a profile that has none yet.
          if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".no-mistakes")) { throw "~\.no-mistakes is there before the install, so the uninstall would keep it as the person's and the comparison would prove nothing of it." }
          & "$env:RUNNER_TEMP\leftovers.exe" snapshot "$env:RUNNER_TEMP\leftovers-before.json" --content (Join-Path $project ".git") --also $npmPrefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install with the one-line command
        if: ${{ matrix.via == 'one-line' }}
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          if ($env:REAL_RELEASE -eq "true") {
            irm "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1" | iex
          } else {
            Get-Content -Raw install.ps1 | Invoke-Expression
          }
          # goblins works at once in the window the install ran in.
          $found = (Get-Command goblins -ErrorAction Stop).Source
          $want = Join-Path $env:LOCALAPPDATA "CodeGoblins\bin\goblins.exe"
          if ($found -ne $want) { throw "goblins resolves to $found in the install's own window, want $want" }
          # The install ends with goblins doctor, whose verdict the next step
          # reads line by line.
          $global:LASTEXITCODE = 0
      - name: Install with the setup program
        if: ${{ matrix.via == 'setup' }}
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          CODE_GOBLINS_SETUP_RELEASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || format('https://github.com/{0}/releases/latest/download', github.repository) }}
        run: |
          # The setup's own install, without its window: it downloads the
          # release's install script and runs it out of sight, reading the
          # steps it says. The test installs onto this runner, so it runs only
          # where CODE_GOBLINS_SETUP_RELEASE names the release to install.
          go test ./cmd/goblins-setup -run '^TestTheSetupInstallsWithDictationReadyOnAFreshRunner$' -count=1 -timeout 25m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the installed home
        env:
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          # A new terminal sees the PATH and GOBLINS_HOME the installers wrote to
          # the registry; a new step does not, and without GOBLINS_HOME goblins
          # takes this checkout for the home.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $env:GOBLINS_HOME = [Environment]::GetEnvironmentVariable("GOBLINS_HOME", "User")
          $ceoHome = Join-Path $env:LOCALAPPDATA "CodeGoblins"
          $bin = Join-Path $ceoHome "bin"
          foreach ($file in "bin\goblins.exe", ".ceo-home", "AGENTS.md", "CLAUDE.md", "config\pipeline.json", "data\routing.json", "state") {
            if (-not (Test-Path -LiteralPath (Join-Path $ceoHome $file))) { throw "the one-line install left no $file in $ceoHome" }
          }
          # The skills this repository ships install once in the shared skills
          # folder, which Claude Code reads through a junction per skill.
          # A published release may predate project-check, which this commit's
          # build carries.
          $skills = @("lavish", "stow")
          if ($env:REAL_RELEASE -ne "true") { $skills += "project-check" }
          foreach ($skill in $skills) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".agents\skills\$skill\SKILL.md"))) { throw "the one-line install left no $skill skill in ~\.agents\skills" }
            if ((Get-Item -LiteralPath (Join-Path $env:USERPROFILE ".claude\skills\$skill") -Force).LinkType -ne "Junction") { throw "~\.claude\skills\$skill is not a junction to ~\.agents\skills\$skill" }
          }
          if ([Environment]::GetEnvironmentVariable("GOBLINS_HOME", "User") -ne $ceoHome) { throw "GOBLINS_HOME is not $ceoHome" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $bin)) { throw "$bin is not on the user PATH" }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          # A hook runs its command with its args, so each entry is read as that
          # whole line. The CEO's hooks are goblins.exe with args hook <name>, and the
          # install writes none of them here: the CEO's terminal starts with its
          # own, and in the user's settings every Claude Code session would run them.
          $ceoHooks = @(@($settings.hooks.PSObject.Properties.Value.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " }) -match "goblins\.exe hook ")
          if ($ceoHooks.Count -gt 0) { throw "the install wrote the CEO's hooks into the Claude Code user settings, where every session runs them: $($ceoHooks -join '; ')" }
          # Each harness gets its own copy of each skill: a symlink needs a
          # right an ordinary Windows user may not have. Codex and pi each read
          # the shared ~\.agents\skills as well as their own folder, and the
          # skills CLI lays pi's copy in the shared one since its 1.7.1.
          # A skill comes from GitHub through the skills CLI, which npm fetches
          # from its registry first: one the install could not fetch is named
          # in its closing note, an environment result, and one missing that
          # the note does not name is the install's failure.
          $installLog = Get-Content -Raw -LiteralPath (Join-Path $env:TEMP "CodeGoblinsInstall.log")
          # tests/acceptance/install_left_out.ps1 owns the rule and its fixtures:
          # a tool the install's closing note names is an environment result on
          # a runner that could not reach it, never a failure of the change.
          . ".\tests\acceptance\install_left_out.ps1"
          $environment = @()
          foreach ($skill in "gh-axi", "chrome-devtools-axi", "no-mistakes") {
            $reason = ''
            foreach ($folders in @(".claude\skills"), @(".pi\agent\skills", ".agents\skills"), @(".codex\skills", ".agents\skills")) {
              $found = @($folders | ForEach-Object { Join-Path $env:USERPROFILE "$_\$skill" } | Where-Object { Test-Path -LiteralPath (Join-Path $_ "SKILL.md") })
              if ($found.Count -eq 0) {
                if (-not $reason) {
                  $reason = Get-LeftOutReason -Text $installLog -Name "$skill skill"
                  if (-not $reason) { throw "the one-line install left the $skill skill in none of $($folders -join ', '), and its log does not name it as one it could not fetch" }
                  $environment += "the install could not fetch the $skill skill, so no harness has it: $reason"
                }
                continue
              }
              if ((Get-Item -LiteralPath $found[0]).LinkType) { throw "$($found[0]) is a link, want a copy" }
            }
          }
          $doctor = & (Join-Path $bin "goblins.exe") doctor
          $doctor | Write-Host
          # A MISSING or broken tool the install named is that same environment
          # result; one it did not name is the install's failure.
          $tools = Get-DoctorVerdict -Doctor $doctor -Log $installLog
          Write-EnvironmentResult -Lines (@($environment) + @($tools.Environment)) -Summary $env:GITHUB_STEP_SUMMARY
          if ($tools.Failures.Count -gt 0) { throw "goblins doctor reports something missing or broken: $($tools.Failures -join '; ')" }
          # Whether dictation is ready is a premise the runner may not be
          # able to make: the check runs `goblins dictation setup` once, asserts
          # readiness when it works, and records a runner that could not
          # download the model as an environment result, never a product
          # failure. tests/acceptance/dictation.ps1 owns that rule and its
          # fixtures, and its summary says which outcome happened.
          & ".\tests\acceptance\dictation.ps1" -Goblins (Join-Path $bin "goblins.exe") -CeoHome $ceoHome -Summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The install set up the crawler connector every goblin carries; a
          # published release from before it has none.
          if ($env:REAL_RELEASE -ne "true" -and -not ($doctor -match "^crawler: ready: ")) { throw "goblins doctor does not report the crawler ready: $($doctor -match '^crawler:')" }
          # no-mistakes is the build this checkout's install.ps1 pins, where
          # no-mistakes' own installer puts it, and its axi run takes what the
          # fleet's gate gives it; a published release's script may pin an
          # earlier one. Only stdout holds the version: stderr may
          # carry an update notice, which Windows PowerShell 5.1 would turn
          # into a terminating error under this step's Stop preference. A copy
          # this runner could not fetch is the environment result the note made
          # it above, so it has no build to assert.
          $noMistakes = (Get-Command no-mistakes -ErrorAction SilentlyContinue).Source
          if (-not $noMistakes) {
            if (-not (Get-LeftOutReason -Text $installLog -Name "no-mistakes")) { throw "the one-line install left no no-mistakes on PATH, and its log does not name it as one it could not install" }
          } else {
            if ($noMistakes -ne (Join-Path $env:LOCALAPPDATA "no-mistakes\no-mistakes.exe")) { throw "no-mistakes resolves to $noMistakes, want it in $env:LOCALAPPDATA\no-mistakes" }
            $pin = [regex]::Match((Get-Content -Raw install.ps1), '\$noMistakesVersion = "([^"]+)"').Groups[1].Value
            $version = & { $ErrorActionPreference = "Continue"; & no-mistakes --version 2>$null } | Out-String
            if ($env:REAL_RELEASE -ne "true" -and $version -notmatch "(?m)^no-mistakes version v$([regex]::Escape($pin))(\s|$)") { throw "no-mistakes --version prints '$($version.Trim())', want the pinned v$pin" }
            $help = & { $ErrorActionPreference = "Continue"; & no-mistakes help axi run 2>$null } | Out-String
            foreach ($flag in "--intent-file", "--launch-assertion") {
              if ($env:REAL_RELEASE -ne "true" -and -not $help.Contains($flag)) { throw "no-mistakes axi run has no $flag, which the fleet's gate needs" }
            }
          }
          # The app the install opened, or its quick start where the release
          # ships no app, started the supervisor, so one runs within a minute,
          # and Code Goblins in the Start menu opens it again.
          $deadline = (Get-Date).AddMinutes(1)
          do { & (Join-Path $bin "goblins.exe") status | Out-Null } while ($LASTEXITCODE -ne 0 -and (Get-Date) -lt $deadline -and -not (Start-Sleep -Seconds 2))
          if ($LASTEXITCODE -ne 0) { throw "no supervisor runs a minute after the install opened Code Goblins" }
          $shortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins.lnk"
          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw "the install made no $shortcutPath" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          # Where the release carries the desktop window the entry starts
          # that program alone, which opens the app with no terminal; a
          # release with none keeps the quick start.
          $opens = if (Test-Path -LiteralPath (Join-Path $bin "goblins-window.exe")) { "goblins-window.exe" } else { "goblins.exe" }
          if ($shortcut.TargetPath -ne (Join-Path $bin $opens) -or $shortcut.Arguments -ne "") { throw "the Start-menu shortcut runs '$($shortcut.TargetPath) $($shortcut.Arguments)', want the home's $opens alone" }
          $global:LASTEXITCODE = 0
      - name: Install again
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the installers wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          if ($env:REAL_RELEASE -eq "true") {
            irm "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1" | iex
          } else {
            Get-Content -Raw install.ps1 | Invoke-Expression
          }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          $commands = @($settings.hooks.SessionStart.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " })
          foreach ($hook in @{ match = "goblins\.exe hook session-start"; want = 0 }, @{ match = "goblins-native-hook\.ps1"; want = 0 }) {
            $count = @($commands -match $hook.match).Count
            if ($count -ne $hook.want) { throw "after a second install SessionStart holds $count hooks matching $($hook.match), want $($hook.want)" }
          }
          # The second install finds dictation's engine and model in place and
          # downloads neither again. When the check step recorded that this
          # runner could not download them, the second install cannot show
          # that precedence, and it is the same environment result, not a
          # failure of the change.
          if ($env:INSTALL_DICTATION -eq "environment") {
            Write-Host "the runner could not download dictation, so the second install's already-set-up premise is an environment result, not proven here"
          } else {
            $log = Get-Content -Raw (Join-Path $env:TEMP "CodeGoblinsInstall.log")
            if ($log -notmatch "dictation: ready: .*, already in .*, so nothing was downloaded") { throw "the second install did not find dictation already set up" }
          }
          $global:LASTEXITCODE = 0
      - name: Use it with one goblin
        shell: powershell
        run: |
          .\tests\uninstall\one_goblin_session.ps1 -Project (Join-Path $env:USERPROFILE "source\demo")
          & "$env:RUNNER_TEMP\leftovers.exe" snapshot "$env:RUNNER_TEMP\leftovers-in-use.json" --content (Join-Path $env:USERPROFILE "source\demo\.git") --also ((npm.cmd prefix --global) | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Uninstall and compare the profile with the one before the install
        shell: powershell
        run: |
          # The uninstall stops the board, the window, the CEO and the goblin
          # itself, keeps the goblin's work and the fleet data at the person's
          # choice, and leaves nothing else: the profile matches the snapshot
          # before the install, apart from what its plan named as kept. The
          # PowerShell 7 job chooses to remove the work and the tools too, so
          # nothing may differ there, and the setup job runs the uninstall
          # Installed apps runs.
          $arguments = @{ Leftovers = "$env:RUNNER_TEMP\leftovers.exe"; Project = (Join-Path $env:USERPROFILE "source\demo") }
          if ("${{ matrix.shell }}" -eq "pwsh") { $arguments.RemoveAll = $true }
          if ("${{ matrix.via }}" -eq "setup") { $arguments.FromInstalledApps = $true }
          .\tests\uninstall\uninstall_and_compare.ps1 @arguments
          exit $LASTEXITCODE
      # The snapshots and the comparison say what the uninstall left, which
      # the job's output names only in part.
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leftovers-${{ matrix.via }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/leftovers-*.json
          if-no-files-found: ignore
          retention-days: 14
      # The install keeps every detail it does not print in its log, which
      # the job's output never shows; keep it, so a failed install can be
      # read after the runner is gone.
      - name: Keep the install's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.via }}-${{ matrix.shell }}
          path: ~/AppData/Local/Temp/CodeGoblinsInstall.log
          if-no-files-found: ignore
          retention-days: 14

  dev:
    needs: [draft, reuse]
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' && needs.reuse.outputs.run == '' }}
    runs-on: windows-latest
    # -Dev runs the same third-party installers as the one-line install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Snapshot the profile before the install
        shell: pwsh
        run: |
          # What the uninstall at the end is compared with: the profile and
          # the machine as they are before Code Goblins is installed.
          go build -o "$env:RUNNER_TEMP\leftovers.exe" ./tools/leftovers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The person's own checkout, which the goblin works in, is theirs
          # before Code Goblins is installed and stays theirs after.
          # A clone, as a person's checkout is, of a repository beside it,
          # since a goblin's worktree starts from origin's default branch.
          $origin = Join-Path $env:USERPROFILE "source\demo-origin.git"
          $seed = Join-Path $env:RUNNER_TEMP "demo-seed"
          git init -q --bare -b main $origin
          git init -q -b main $seed
          Set-Content -LiteralPath (Join-Path $seed "README.md") -Value "demo"
          git -C $seed add README.md
          git -C $seed -c user.name=Person -c user.email=person@example.invalid commit -q -m "first"
          git -C $seed push -q $origin main
          $project = Join-Path $env:USERPROFILE "source\demo"
          git clone -q $origin $project
          # npm keeps the tools it installs globally where it is told,
          # outside the profile on a runner, so the snapshots read it too.
          $npmPrefix = (npm prefix --global) | Select-Object -Last 1
          # The install takes a ~\.no-mistakes it finds for the person's
          # own, which the uninstall keeps, so the comparison proves what the
          # uninstall does with it only on a profile that has none yet.
          if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".no-mistakes")) { throw "~\.no-mistakes is there before the install, so the uninstall would keep it as the person's and the comparison would prove nothing of it." }
          & "$env:RUNNER_TEMP\leftovers.exe" snapshot "$env:RUNNER_TEMP\leftovers-before.json" --content (Join-Path $project ".git") --also $npmPrefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install from the clone
        run: |
          .\install.cmd -Dev
          # A build from source is unsigned, and the install must say so in
          # its log, which holds every detail it does not print.
          if (-not ((Get-Content -Raw (Join-Path $env:TEMP "CodeGoblinsInstall.log")) -match "These programs are unsigned")) { throw "the -Dev install did not say that its programs are unsigned" }
          # goblins.exe embeds the board -Dev builds first, and without it serves a
          # page saying the board was not built.
          if (-not (Test-Path internal/boardweb/dist/board/index.html)) { throw "the -Dev install built no board for goblins.exe to embed" }
          # The install ends with goblins doctor, whose verdict the next step
          # reads line by line, as the one-line job's does.
          $global:LASTEXITCODE = 0
      - name: Check the per-user home
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the install wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $clone = $env:GITHUB_WORKSPACE
          $ceoHome = Join-Path $env:LOCALAPPDATA "CodeGoblins"
          $bin = Join-Path $ceoHome "bin"
          # -Dev installs the same per-user home the one-line install does,
          # and the clone keeps no program.
          if ([Environment]::GetEnvironmentVariable("GOBLINS_HOME", "User") -ne $ceoHome) { throw "GOBLINS_HOME is not $ceoHome" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $bin)) { throw "$bin is not on the user PATH" }
          $found = (Get-Command goblins -ErrorAction Stop).Source
          if ($found -ne (Join-Path $bin "goblins.exe")) { throw "goblins resolves to $found, want the home's bin\goblins.exe" }
          $programs = @(Get-ChildItem -LiteralPath $clone -Filter *.exe* -File | ForEach-Object Name)
          if ($programs.Count -gt 0) { throw "the clone holds $($programs -join ', ') after -Dev, want no program" }
          foreach ($skill in "lavish", "stow", "project-check") {
            if ((Get-Item -LiteralPath (Join-Path $env:USERPROFILE ".claude\skills\$skill") -Force).LinkType -ne "Junction") { throw "~\.claude\skills\$skill is not a junction to ~\.agents\skills\$skill" }
          }
          $commands = @((Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json).hooks.SessionStart.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " })
          if ($commands -match "goblins-native-hook\.ps1") { throw "-Dev wrote the native hooks into the Claude Code user settings, where every session runs them" }
          if ($commands -match "goblins\.exe hook ") { throw "-Dev wrote the CEO's hooks into the Claude Code user settings, where every session runs them" }
          # tests/acceptance/install_left_out.ps1 owns the rule and its fixtures:
          # a tool the install's closing note names is an environment result on
          # a runner that could not reach it, never a failure of the change.
          . ".\tests\acceptance\install_left_out.ps1"
          $installLog = Get-Content -Raw -LiteralPath (Join-Path $env:TEMP "CodeGoblinsInstall.log")
          $environment = @()
          foreach ($skill in "gh-axi", "chrome-devtools-axi", "no-mistakes") {
            if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".claude\skills\$skill\SKILL.md")) { continue }
            $reason = Get-LeftOutReason -Text $installLog -Name "$skill skill"
            if (-not $reason) { throw "-Dev did not install the $skill skill, and its log does not name it as one it could not fetch" }
            $environment += "the install could not fetch the $skill skill, so ~\.claude\skills holds none: $reason"
          }
          $doctor = & goblins doctor
          $doctor | Write-Host
          # A MISSING or broken tool the install named is that same environment
          # result; one it did not name is the install's failure.
          $tools = Get-DoctorVerdict -Doctor $doctor -Log $installLog
          Write-EnvironmentResult -Lines (@($environment) + @($tools.Environment)) -Summary $env:GITHUB_STEP_SUMMARY
          if ($tools.Failures.Count -gt 0) { throw "goblins doctor reports something missing or broken: $($tools.Failures -join '; ')" }
          # The home's dictation is the same premise as the one-line job's:
          # the check runs `goblins dictation setup` once and records a runner
          # that could not download the model as an environment result.
          & ".\tests\acceptance\dictation.ps1" -Goblins (Join-Path $bin "goblins.exe") -CeoHome $ceoHome -Summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deadline = (Get-Date).AddMinutes(1)
          do { & goblins status | Out-Null } while ($LASTEXITCODE -ne 0 -and (Get-Date) -lt $deadline -and -not (Start-Sleep -Seconds 2))
          if ($LASTEXITCODE -ne 0) { throw "no supervisor runs a minute after -Dev opened Code Goblins" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins.lnk"))
          # -Dev builds the desktop window, which goblins install puts in bin beside
          # goblins, so Code Goblins in the Start menu starts that program
          # alone, and it is the one entry.
          if (-not (Test-Path -LiteralPath (Join-Path $bin "goblins-window.exe"))) { throw "-Dev put no desktop window in $bin" }
          if ($shortcut.TargetPath -ne (Join-Path $bin "goblins-window.exe") -or $shortcut.Arguments -ne "") { throw "the Start-menu shortcut runs '$($shortcut.TargetPath) $($shortcut.Arguments)', want the home's goblins-window.exe alone" }
          if (Test-Path -LiteralPath (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins Window.lnk")) { throw "the install made a second Start-menu entry for the window" }
          # -Dev builds the hook program too, the same goblins with no console,
          # which goblins install puts in bin for the goblins' hooks.
          if (-not (Test-Path -LiteralPath (Join-Path $bin "goblins-hook.exe"))) { throw "-Dev put no hook program in $bin" }
          $global:LASTEXITCODE = 0
      - name: Use it with one goblin
        shell: powershell
        run: |
          .\tests\uninstall\one_goblin_session.ps1 -Project (Join-Path $env:USERPROFILE "source\demo")
          & "$env:RUNNER_TEMP\leftovers.exe" snapshot "$env:RUNNER_TEMP\leftovers-in-use.json" --content (Join-Path $env:USERPROFILE "source\demo\.git") --also ((npm.cmd prefix --global) | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Uninstall and compare the profile with the one before the install
        shell: powershell
        run: |
          # Run from the clone's build, the uninstall leaves the clone as it
          # was and the profile as it was before the install, apart from what
          # its plan named as kept.
          .\tests\uninstall\uninstall_and_compare.ps1 -Leftovers "$env:RUNNER_TEMP\leftovers.exe" -Project (Join-Path $env:USERPROFILE "source\demo")
          exit $LASTEXITCODE
      # The snapshots and the comparison say what the uninstall left, which
      # the job's output names only in part.
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leftovers-dev
          path: ${{ runner.temp }}/leftovers-*.json
          if-no-files-found: ignore
          retention-days: 14
      # The install keeps every detail it does not print in its log, which
      # the job's output never shows; keep it, so a failed install can be
      # read after the runner is gone.
      - name: Keep the install's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-dev
          path: ~/AppData/Local/Temp/CodeGoblinsInstall.log
          if-no-files-found: ignore
          retention-days: 14

  # A person who installed a published release, with its own install script
  # as its notes say, updates with goblins update while the CEO and a goblin
  # work. Each release here predates the rename, which its update cannot cross,
  # so its home moves to goblins by this commit's goblins cutover first, with the fleet
  # paused, and the CEO and the goblin are brought back to work under goblins.
  # This commit's build is served as the newest release, and so is a build of
  # it whose board exits as it starts: the update to that one rolls back, the
  # update to this commit installs it, and each keeps the home, the running
  # terminals, the person's settings, project, credential and work, and
  # dictation ready, or the update's own download recorded as the same
  # environment result.
  update:
    name: ${{ matrix.by }} from ${{ matrix.from }}
    needs: [draft, reuse]
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' && needs.reuse.outputs.run == '' && !inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        # The latest release, and the newest pre-release, each from before
        # the rename, which the update moves to goblins by itself; and the
        # one-line install run over the latest, which does the same.
        from: [v0.5.18, v0.5.16]
        by: [update]
        include:
          - from: v0.5.18
            by: install
    runs-on: windows-latest
    # The published install runs the same third-party installers as the
    # one-line install, and the update to a newer dictation model fetches it.
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Name the staged releases' folder and the facts' file
        run: |
          "RELEASES=$env:RUNNER_TEMP\releases" >> $env:GITHUB_ENV
          "FACTS=$env:RUNNER_TEMP\fleet-before.json" >> $env:GITHUB_ENV
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Serve this commit as the newest release, and a build of it that does not start
        run: |
          # goblins.exe embeds the board, which a release builds first.
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/update/stage_releases.ps1 -Version v0.5.99 -Folder $env:RELEASES -Port 8765
      - name: Install ${{ matrix.from }} from its published release
        shell: powershell
        env:
          FROM: ${{ matrix.from }}
        run: |
          # The person's own checkout, a clone of a repository beside it, as
          # the install jobs make it.
          $origin = Join-Path $env:USERPROFILE "source\demo-origin.git"
          $seed = Join-Path $env:RUNNER_TEMP "demo-seed"
          git init -q --bare -b main $origin
          git init -q -b main $seed
          Set-Content -LiteralPath (Join-Path $seed "README.md") -Value "demo"
          git -C $seed add README.md
          git -C $seed -c user.name=Person -c user.email=person@example.invalid commit -q -m "first"
          git -C $seed push -q $origin main
          git clone -q $origin (Join-Path $env:USERPROFILE "source\demo")
          # GitHub answers a release download with a gateway timeout now and
          # then, which that release's install script gives up on, so both the
          # script and the install that fetches the build are tried a few
          # times; nothing here masks a failed install, and the home every
          # later step works from decides whether one landed.
          $installer = Join-Path $env:RUNNER_TEMP "install-$env:FROM.ps1"
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri "https://github.com/fpresta0607/code-goblins/releases/download/$env:FROM/install.ps1" -OutFile $installer -UseBasicParsing -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw "$env:FROM's install script could not be downloaded after $attempt tries: $($_.Exception.Message)" }
              Write-Host "$env:FROM's install script did not download (attempt $attempt of 3): $($_.Exception.Message); trying again"
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
          $installed = Join-Path $env:LOCALAPPDATA "CodeGoblins\bin\goblins.exe"
          foreach ($attempt in 1..3) {
            Get-Content -Raw -LiteralPath $installer | Invoke-Expression
            # Through Invoke-Expression a failed install leaves LASTEXITCODE 1
            # instead of throwing, so it is read here, never masked.
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $installed)) { break }
            if ($attempt -eq 3) { throw "installing $env:FROM left no $installed, ending at exit code $LASTEXITCODE after $attempt tries, so there is no home for the update to be made from; the install said why above and its log is $(Join-Path $env:TEMP 'CodeGoblinsInstall.log')" }
            Write-Host "installing $env:FROM ended at exit code $LASTEXITCODE with no $installed (attempt $attempt of 3); trying again"
            Start-Sleep -Seconds ($attempt * 15)
          }
      - name: Put the CEO and a goblin to work under the release's names
        run: ./tests/update/fleet_at_work.ps1 -Project (Join-Path $env:USERPROFILE "source\demo") -Facts $env:FACTS -PreRename
      - name: Leave the journal of an update the release finished, as a home it updated before holds
        run: |
          # Every release before the rename keeps the journal of its last
          # update, naming its own program and goblins.exe, which this commit
          # must read as history once that update finished.
          . ./tests/pre_rename_build.ps1
          $ceoHome = [Environment]::GetEnvironmentVariable("${PreRenameSettingPrefix}HOME", "User")
          $bin = Join-Path $ceoHome "bin"
          $folder = Join-Path $ceoHome "state\update"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $hash = (Get-FileHash (Join-Path $bin "goblins.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $aliases = foreach ($name in "$PreRenameCommand.exe", "goblins.exe") { [ordered]@{ name = $name; previous_sha256 = $hash; backup = Join-Path $folder "previous-$name" } }
          $now = (Get-Date).ToUniversalTime().ToString("o")
          $journal = [ordered]@{
            schema           = "$PreRenameCommand-update.v1"
            root             = $bin
            phase            = "done"
            candidate        = Join-Path $bin "$PreRenameCommand.exe"
            candidate_copy   = Join-Path $folder "candidate.exe"
            candidate_sha256 = $hash
            aliases          = @($aliases)
            started          = $now
            updated          = $now
            outcome          = "the candidate serves"
          }
          [IO.File]::WriteAllText((Join-Path $folder "journal.json"), (ConvertTo-Json -InputObject $journal -Depth 4))
      - name: Update to a build whose board does not start, which rolls back and leaves the release's names
        if: ${{ matrix.by == 'update' }}
        run: ./tests/update/update_and_check.ps1 -Api http://127.0.0.1:8765/broken/latest -Release "$env:RELEASES\broken" -Want rolled-back -Project (Join-Path $env:USERPROFILE "source\demo") -Facts $env:FACTS -PreRename
      - name: Update to this commit, which moves the home to goblins by itself
        if: ${{ matrix.by == 'update' }}
        run: ./tests/update/update_and_check.ps1 -Api http://127.0.0.1:8765/good/latest -Release "$env:RELEASES\good" -Want installed -Project (Join-Path $env:USERPROFILE "source\demo") -Facts $env:FACTS -PreRename
      - name: Install this commit over the release, which moves the home to goblins by itself
        if: ${{ matrix.by == 'install' }}
        run: ./tests/update/update_and_check.ps1 -InstallFrom http://127.0.0.1:8765/good -Release "$env:RELEASES\good" -Want installed -Project (Join-Path $env:USERPROFILE "source\demo") -Facts $env:FACTS -PreRename
      - name: End the release server and the stand-in model
        if: always()
        run: |
          foreach ($file in "$env:RELEASES\server.pid", "$env:FACTS.stand-in.pid") {
            if (Test-Path -LiteralPath $file) { Stop-Process -Id ([int](Get-Content -LiteralPath $file)) -ErrorAction SilentlyContinue }
          }
      # One artifact holds files of one drive, and the runner's temporary
      # folder and the profile are on two.
      - name: Keep the updates' logs and the facts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.by }}-logs-${{ matrix.from }}
          path: |
            ${{ runner.temp }}/update-*.log
            ${{ runner.temp }}/install-over-*.log
            ${{ runner.temp }}/fleet-before.json*
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the install's and the board's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.by }}-home-logs-${{ matrix.from }}
          path: |
            ~/AppData/Local/Temp/CodeGoblinsInstall.log
            ~/AppData/Local/CodeGoblins/state/serve.log
            ~/AppData/Local/CodeGoblins/state/update
          if-no-files-found: ignore
          retention-days: 14

  # A pull request run whose installs both passed leaves a record named for
  # the tree and first parent it tested, which a push to main with the same
  # pair reads instead of installing again (tools/pushreuse). A record that
  # fails only leaves that push to install again, so it never fails a run.
  # Its installs wait on reuse, which a pull request skips, and a skipped job
  # skips every job after it unless the condition says otherwise, so this
  # one reads the installs' own results.
  passed:
    needs: [one-line, dev, update]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.one-line.result == 'success' && needs.dev.result == 'success' && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        continue-on-error: true
      - uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: stable
          cache: false
      - name: Name the record of the tree this run passed
        id: record
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(go run ./tools/pushreuse name install.yml)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/passed.txt"
      - uses: actions/upload-artifact@v4
        if: steps.record.outputs.name != ''
        continue-on-error: true
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/passed.txt
          retention-days: 7
