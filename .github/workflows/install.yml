name: install

# Proves both installs on a clean Windows user profile, which a GitHub-hosted
# runner is by construction: the one-line install, with this commit's own
# build served as the release and installed exactly as `irm ... | iex` would,
# and `.\install.cmd -Dev` from this checkout.
on:
  pull_request:
    paths:
      - install.ps1
      - install.cmd
      - home_files.go
      - cmd/cfo/install.go
      - cmd/cfo/launcher.go
      - cmd/cfo/serve.go
      - cmd/cfo/native.go
      - cmd/cfo/main.go
      - cmd/cfo/doctor.go
      - internal/home/**
      - internal/install/**
      - internal/nativehook/**
      - internal/doctor/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - install.ps1
      - install.cmd
      - home_files.go
      - cmd/cfo/install.go
      - cmd/cfo/launcher.go
      - cmd/cfo/serve.go
      - cmd/cfo/native.go
      - cmd/cfo/main.go
      - cmd/cfo/doctor.go
      - internal/home/**
      - internal/install/**
      - internal/nativehook/**
      - internal/doctor/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      release:
        description: Install the latest published release instead of this commit's build
        type: boolean
        default: false

concurrency:
  # A newer commit on a pull request supersedes the run on the older one,
  # which is cancelled. Every other run, on main or started by hand, has a
  # group of its own, so none is ever cancelled or held waiting.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-line:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    # The bootstrap runs third-party installers; one that waits for input
    # fails the job instead of holding the runner for hours.
    timeout-minutes: 30
    # A step's own shell cannot read the matrix; the job's run default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Serve this commit as the release
        if: ${{ !inputs.release }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          go build -o release/cfo.exe ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash release/cfo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS", "$hash  cfo.exe`n")
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "release" -WindowStyle Hidden
          # The next step downloads at once, so wait until the server answers.
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            try { Invoke-WebRequest http://127.0.0.1:8765/SHA256SUMS -UseBasicParsing | Out-Null; break }
            catch { if ((Get-Date) -gt $deadline) { throw "the release server did not answer within 30 seconds" }; Start-Sleep -Milliseconds 250 }
          }
      - name: Install with the one-line command
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          if ($env:REAL_RELEASE -eq "true") {
            irm "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1" | iex
          } else {
            Get-Content -Raw install.ps1 | Invoke-Expression
          }
          # goblins works at once in the window the install ran in.
          $found = (Get-Command goblins -ErrorAction Stop).Source
          $want = Join-Path $env:LOCALAPPDATA "CodeGoblins\goblins.exe"
          if ($found -ne $want) { throw "goblins resolves to $found in the install's own window, want $want" }
          # The install ends with goblins doctor, whose verdict the next step
          # reads line by line.
          $global:LASTEXITCODE = 0
      - name: Check the installed home
        env:
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          # A new terminal sees the PATH and CFO_HOME the installers wrote to
          # the registry; a new step does not, and without CFO_HOME goblins
          # takes this checkout for the home.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $env:CFO_HOME = [Environment]::GetEnvironmentVariable("CFO_HOME", "User")
          $cfoHome = Join-Path $env:LOCALAPPDATA "CodeGoblins"
          foreach ($file in "cfo.exe", "goblins.exe", ".cfo-home", "AGENTS.md", "CLAUDE.md", ".agents\skills\lavish\SKILL.md", ".claude\skills\lavish\SKILL.md", "config\pipeline.json", "data\routing.json", "state") {
            if (-not (Test-Path -LiteralPath (Join-Path $cfoHome $file))) { throw "the one-line install left no $file in $cfoHome" }
          }
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User") -ne $cfoHome) { throw "CFO_HOME is not $cfoHome" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $cfoHome)) { throw "$cfoHome is not on the user PATH" }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          # A hook runs its command with its args: cfo install writes the CFO hooks as
          # cfo.exe with args hook <name>, so each entry is read as that whole line.
          if (-not (@($settings.hooks.SessionStart.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " }) -match "cfo\.exe hook session-start")) { throw "the CFO hooks are not in the Claude Code user settings" }
          # Each harness gets its own copy of each skill: a symlink needs a
          # right an ordinary Windows user may not have.
          foreach ($skill in "gh-axi", "chrome-devtools-axi", "no-mistakes") {
            foreach ($folders in @(".claude\skills"), @(".pi\agent\skills"), @(".codex\skills", ".agents\skills")) {
              $found = @($folders | ForEach-Object { Join-Path $env:USERPROFILE "$_\$skill" } | Where-Object { Test-Path -LiteralPath (Join-Path $_ "SKILL.md") })
              if ($found.Count -eq 0) { throw "the one-line install left the $skill skill in none of $($folders -join ', ')" }
              if ((Get-Item -LiteralPath $found[0]).LinkType) { throw "$($found[0]) is a link, want a copy" }
            }
          }
          $doctor = & (Join-Path $cfoHome "goblins.exe") doctor
          $doctor | Write-Host
          $failing = @($doctor | Where-Object { $_ -match "^(MISSING|broken)\s" })
          if ($failing.Count -gt 0) { throw "goblins doctor reports something missing or broken: $($failing -join '; ')" }
          # no-mistakes is the release this checkout's install.ps1 pins, where
          # no-mistakes' own installer puts it; a published release's script
          # may pin an earlier one. Only stdout holds the version: stderr may
          # carry an update notice, which Windows PowerShell 5.1 would turn
          # into a terminating error under this step's Stop preference.
          $noMistakes = (Get-Command no-mistakes -ErrorAction Stop).Source
          if ($noMistakes -ne (Join-Path $env:LOCALAPPDATA "no-mistakes\no-mistakes.exe")) { throw "no-mistakes resolves to $noMistakes, want it in $env:LOCALAPPDATA\no-mistakes" }
          $pin = [regex]::Match((Get-Content -Raw install.ps1), '\$noMistakesVersion = "([^"]+)"').Groups[1].Value
          $version = & { $ErrorActionPreference = "Continue"; & no-mistakes --version 2>$null } | Out-String
          if ($env:REAL_RELEASE -ne "true" -and $version -notmatch "(?m)^no-mistakes version v$([regex]::Escape($pin))(\s|$)") { throw "no-mistakes --version prints '$($version.Trim())', want the pinned v$pin" }
          # The install's quick start started the supervisor, so one runs, and Code
          # Goblins in the Start menu opens it again.
          & (Join-Path $cfoHome "goblins.exe") status
          if ($LASTEXITCODE -ne 0) { throw "no supervisor runs after the install's quick start" }
          $shortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins.lnk"
          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw "the install made no $shortcutPath" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          # Where the release carries the desktop window the entry starts
          # that program alone, which opens the app with no terminal; a
          # release with none keeps the quick start.
          $opens = if (Test-Path -LiteralPath (Join-Path $cfoHome "goblins-window.exe")) { "goblins-window.exe" } else { "goblins.exe" }
          if ($shortcut.TargetPath -ne (Join-Path $cfoHome $opens) -or $shortcut.Arguments -ne "") { throw "the Start-menu shortcut runs '$($shortcut.TargetPath) $($shortcut.Arguments)', want the home's $opens alone" }
          $global:LASTEXITCODE = 0
      - name: Install again
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the installers wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          if ($env:REAL_RELEASE -eq "true") {
            irm "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1" | iex
          } else {
            Get-Content -Raw install.ps1 | Invoke-Expression
          }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          $commands = @($settings.hooks.SessionStart.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " })
          foreach ($hook in "cfo\.exe hook session-start", "cfo-native-hook\.ps1") {
            $count = @($commands -match $hook).Count
            if ($count -ne 1) { throw "after a second install SessionStart holds $count hooks matching $hook, want 1" }
          }
          $global:LASTEXITCODE = 0
      - name: Uninstall
        run: |
          $cfoHome = Join-Path $env:LOCALAPPDATA "CodeGoblins"
          # From a neutral folder, as a user would: inside a checkout,
          # uninstall unwires that checkout instead.
          Set-Location $env:RUNNER_TEMP
          # As in a new terminal, CFO_HOME names the home whose supervisor
          # stop ends.
          $env:CFO_HOME = [Environment]::GetEnvironmentVariable("CFO_HOME", "User")
          & (Join-Path $cfoHome "goblins.exe") stop
          if ($LASTEXITCODE -ne 0) { throw "goblins stop exited with code $LASTEXITCODE" }
          & (Join-Path $cfoHome "goblins.exe") uninstall
          if ($LASTEXITCODE -ne 0) { throw "goblins uninstall exited with code $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins.lnk")) { throw "the Start-menu shortcut survived the uninstall" }
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User")) { throw "CFO_HOME survived the uninstall" }
          if (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $cfoHome) { throw "$cfoHome is still on the user PATH" }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          $left = @(@($settings.hooks.PSObject.Properties.Value.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " }) -match "cfo\.exe hook |cfo-native-hook\.ps1")
          if ($left.Count -gt 0) { throw "hooks survived the uninstall: $($left -join '; ')" }
          if (-not (Test-Path -LiteralPath (Join-Path $cfoHome "state"))) { throw "the uninstall removed the home's state" }
          $global:LASTEXITCODE = 0

  dev:
    runs-on: windows-latest
    # -Dev runs the same third-party installers as the one-line install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install from the clone
        run: |
          .\install.cmd -Dev | Tee-Object -Variable installed
          # A build from source is unsigned, and the install must say so.
          if (-not ($installed -match "These programs are unsigned")) { throw "the -Dev install did not say that its programs are unsigned" }
          # The install ends with goblins doctor, whose verdict the next step
          # reads line by line, as the one-line job's does.
          $global:LASTEXITCODE = 0
      - name: Check the clone is the CFO home
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the install wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $clone = $env:GITHUB_WORKSPACE
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User") -ne $clone) { throw "CFO_HOME is not the clone, $clone" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $clone)) { throw "the clone is not on the user PATH" }
          foreach ($name in "cfo", "goblins") {
            $found = (Get-Command $name -ErrorAction Stop).Source
            if ($found -ne (Join-Path $clone "$name.exe")) { throw "$name resolves to $found, want the clone's $name.exe" }
          }
          if ((Get-Item -LiteralPath (Join-Path $clone ".claude\skills") -Force).LinkType -ne "Junction") { throw ".claude\skills is not a junction to .agents\skills" }
          $commands = @((Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json).hooks.SessionStart.hooks | ForEach-Object { @($_.command) + @($_.args) -join " " })
          foreach ($hook in "cfo\.exe hook session-start", "cfo-native-hook\.ps1") {
            if (-not ($commands -match $hook)) { throw "no SessionStart hook in the Claude Code user settings matches $hook" }
          }
          foreach ($skill in "gh-axi", "chrome-devtools-axi", "no-mistakes") {
            if (-not (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".claude\skills\$skill\SKILL.md"))) { throw "-Dev did not install the $skill skill" }
          }
          $doctor = & goblins doctor
          $doctor | Write-Host
          $failing = @($doctor | Where-Object { $_ -match "^(MISSING|broken)\s" })
          if ($failing.Count -gt 0) { throw "goblins doctor reports something missing or broken: $($failing -join '; ')" }
          & goblins status
          if ($LASTEXITCODE -ne 0) { throw "no supervisor runs after -Dev's quick start" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins.lnk"))
          # -Dev builds the desktop window beside goblins, so Code Goblins in
          # the Start menu starts that program alone, and it is the one entry.
          if (-not (Test-Path -LiteralPath (Join-Path $clone "goblins-window.exe"))) { throw "-Dev built no desktop window in the clone" }
          if ($shortcut.TargetPath -ne (Join-Path $clone "goblins-window.exe") -or $shortcut.Arguments -ne "") { throw "the Start-menu shortcut runs '$($shortcut.TargetPath) $($shortcut.Arguments)', want the clone's goblins-window.exe alone" }
          if (Test-Path -LiteralPath (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins Window.lnk")) { throw "the install made a second Start-menu entry for the window" }
          $global:LASTEXITCODE = 0
      - name: Uninstall
        run: |
          # Run in the clone, uninstall unwires the clone and keeps it.
          & (Join-Path $env:GITHUB_WORKSPACE "goblins.exe") stop
          if ($LASTEXITCODE -ne 0) { throw "goblins stop exited with code $LASTEXITCODE" }
          & (Join-Path $env:GITHUB_WORKSPACE "goblins.exe") uninstall
          if ($LASTEXITCODE -ne 0) { throw "goblins uninstall exited with code $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Code Goblins.lnk")) { throw "the Start-menu shortcut survived the uninstall" }
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User")) { throw "CFO_HOME survived the uninstall" }
          if (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $env:GITHUB_WORKSPACE) { throw "the clone is still on the user PATH" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "cfo.exe"))) { throw "the uninstall removed the clone's build" }
          $global:LASTEXITCODE = 0
