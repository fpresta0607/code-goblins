name: install

# Proves both installs on a clean Windows user profile, which a GitHub-hosted
# runner is by construction: the one-line install, with this commit's own
# build served as the release and installed exactly as `irm ... | iex` would,
# and `.\install.cmd -Dev` from this checkout.
on:
  pull_request:
    paths:
      - install.ps1
      - install.cmd
      - home_files.go
      - cmd/cfo/install.go
      - cmd/cfo/native.go
      - cmd/cfo/main.go
      - cmd/cfo/doctor.go
      - internal/home/**
      - internal/install/**
      - internal/nativehook/**
      - internal/doctor/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - install.ps1
      - install.cmd
      - home_files.go
      - cmd/cfo/install.go
      - cmd/cfo/native.go
      - cmd/cfo/main.go
      - cmd/cfo/doctor.go
      - internal/home/**
      - internal/install/**
      - internal/nativehook/**
      - internal/doctor/**
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      release:
        description: Install the latest published release instead of this commit's build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  one-line:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    # The bootstrap runs third-party installers; one that waits for input
    # fails the job instead of holding the runner for hours.
    timeout-minutes: 30
    # A step's own shell cannot read the matrix; the job's run default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Serve this commit as the release
        if: ${{ !inputs.release }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          go build -o release/cfo.exe ./cmd/cfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash release/cfo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS", "$hash  cfo.exe`n")
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "release" -WindowStyle Hidden
      - name: Install with the one-line command
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          if ($env:REAL_RELEASE -eq "true") {
            irm https://raw.githubusercontent.com/fpresta0607/code-goblins/main/install.ps1 | iex
          } else {
            Get-Content -Raw install.ps1 | Invoke-Expression
          }
          # The install ends with goblins doctor, whose verdict the next step
          # reads line by line: kimi has no scriptable installer, so its spawn
          # probe is broken on a clean runner.
          $global:LASTEXITCODE = 0
      - name: Check the installed home
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the installers wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $cfoHome = Join-Path $env:LOCALAPPDATA "CodeGoblins"
          foreach ($file in "cfo.exe", "goblins.exe", ".cfo-home", "AGENTS.md", "CLAUDE.md", ".agents\skills\lavish\SKILL.md", ".claude\skills\lavish\SKILL.md", "config\pipeline.json", "data\routing.json", "state") {
            if (-not (Test-Path -LiteralPath (Join-Path $cfoHome $file))) { throw "the one-line install left no $file in $cfoHome" }
          }
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User") -ne $cfoHome) { throw "CFO_HOME is not $cfoHome" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $cfoHome)) { throw "$cfoHome is not on the user PATH" }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          if (-not (@($settings.hooks.SessionStart.hooks.command) -match "cfo\.exe hook session-start")) { throw "the CFO hooks are not in the Claude Code user settings" }
          # Each harness gets its own copy of each skill: a symlink needs a
          # right an ordinary Windows user may not have.
          foreach ($skill in "gh-axi", "chrome-devtools-axi", "no-mistakes") {
            foreach ($folders in @(".claude\skills"), @(".pi\agent\skills"), @(".codex\skills", ".agents\skills")) {
              $found = @($folders | ForEach-Object { Join-Path $env:USERPROFILE "$_\$skill" } | Where-Object { Test-Path -LiteralPath (Join-Path $_ "SKILL.md") })
              if ($found.Count -eq 0) { throw "the one-line install left the $skill skill in none of $($folders -join ', ')" }
              if ((Get-Item -LiteralPath $found[0]).LinkType) { throw "$($found[0]) is a link, want a copy" }
            }
          }
          $doctor = & (Join-Path $cfoHome "goblins.exe") doctor
          $doctor | Write-Host
          $failing = @($doctor | Where-Object { $_ -match "^(MISSING|broken)\s" -and $_ -notmatch "^(MISSING\s+kimi\s|broken\s+kimi\s+harness spawn probe: not found on PATH)" })
          if ($failing.Count -gt 0) { throw "goblins doctor reports more than kimi missing: $($failing -join '; ')" }
          $global:LASTEXITCODE = 0
      - name: Install again
        env:
          CODE_GOBLINS_RELEASE_BASE: ${{ !inputs.release && 'http://127.0.0.1:8765' || '' }}
          REAL_RELEASE: ${{ inputs.release }}
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the installers wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          if ($env:REAL_RELEASE -eq "true") {
            irm https://raw.githubusercontent.com/fpresta0607/code-goblins/main/install.ps1 | iex
          } else {
            Get-Content -Raw install.ps1 | Invoke-Expression
          }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          $commands = @($settings.hooks.SessionStart.hooks.command)
          foreach ($hook in "cfo\.exe hook session-start", "cfo-native-hook\.ps1") {
            $count = @($commands -match $hook).Count
            if ($count -ne 1) { throw "after a second install SessionStart holds $count hooks matching $hook, want 1" }
          }
          $global:LASTEXITCODE = 0
      - name: Uninstall
        run: |
          $cfoHome = Join-Path $env:LOCALAPPDATA "CodeGoblins"
          # From a neutral folder, as a user would: inside a checkout,
          # uninstall unwires that checkout instead.
          Set-Location $env:RUNNER_TEMP
          & (Join-Path $cfoHome "goblins.exe") uninstall
          if ($LASTEXITCODE -ne 0) { throw "goblins uninstall exited with code $LASTEXITCODE" }
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User")) { throw "CFO_HOME survived the uninstall" }
          if (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $cfoHome) { throw "$cfoHome is still on the user PATH" }
          $settings = Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json
          $left = @(@($settings.hooks.PSObject.Properties.Value.hooks.command) -match "cfo\.exe hook |cfo-native-hook\.ps1")
          if ($left.Count -gt 0) { throw "hooks survived the uninstall: $($left -join '; ')" }
          if (-not (Test-Path -LiteralPath (Join-Path $cfoHome "state"))) { throw "the uninstall removed the home's state" }
          $global:LASTEXITCODE = 0

  dev:
    runs-on: windows-latest
    # -Dev runs the same third-party installers as the one-line install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install from the clone
        run: |
          .\install.cmd -Dev
          # The install ends with goblins doctor, whose verdict the next step
          # reads line by line, as the one-line job's does.
          $global:LASTEXITCODE = 0
      - name: Check the clone is the CFO home
        run: |
          # A new terminal, as the install tells the user to open, sees the PATH
          # the install wrote to the registry; a new step does not.
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $clone = $env:GITHUB_WORKSPACE
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User") -ne $clone) { throw "CFO_HOME is not the clone, $clone" }
          if (-not (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $clone)) { throw "the clone is not on the user PATH" }
          foreach ($name in "cfo", "goblins") {
            $found = (Get-Command $name -ErrorAction Stop).Source
            if ($found -ne (Join-Path $clone "$name.exe")) { throw "$name resolves to $found, want the clone's $name.exe" }
          }
          if ((Get-Item -LiteralPath (Join-Path $clone ".claude\skills") -Force).LinkType -ne "Junction") { throw ".claude\skills is not a junction to .agents\skills" }
          $commands = @((Get-Content -Raw (Join-Path $env:USERPROFILE ".claude\settings.json") | ConvertFrom-Json).hooks.SessionStart.hooks.command)
          foreach ($hook in "cfo\.exe hook session-start", "cfo-native-hook\.ps1") {
            if (-not ($commands -match $hook)) { throw "no SessionStart hook in the Claude Code user settings matches $hook" }
          }
          foreach ($skill in "gh-axi", "chrome-devtools-axi", "no-mistakes") {
            if (-not (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".claude\skills\$skill\SKILL.md"))) { throw "-Dev did not install the $skill skill" }
          }
          $doctor = & goblins doctor
          $doctor | Write-Host
          $failing = @($doctor | Where-Object { $_ -match "^(MISSING|broken)\s" -and $_ -notmatch "^(MISSING\s+kimi\s|broken\s+kimi\s+harness spawn probe: not found on PATH)" })
          if ($failing.Count -gt 0) { throw "goblins doctor reports more than kimi missing: $($failing -join '; ')" }
          $global:LASTEXITCODE = 0
      - name: Uninstall
        run: |
          # Run in the clone, uninstall unwires the clone and keeps it.
          & (Join-Path $env:GITHUB_WORKSPACE "goblins.exe") uninstall
          if ($LASTEXITCODE -ne 0) { throw "goblins uninstall exited with code $LASTEXITCODE" }
          if ([Environment]::GetEnvironmentVariable("CFO_HOME", "User")) { throw "CFO_HOME survived the uninstall" }
          if (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains $env:GITHUB_WORKSPACE) { throw "the clone is still on the user PATH" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "cfo.exe"))) { throw "the uninstall removed the clone's build" }
          $global:LASTEXITCODE = 0
