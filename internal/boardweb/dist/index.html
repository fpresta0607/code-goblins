<h1 style="margin: 12px 0 14px; color: #00e59b; font-size: 28px; font-weight: 700; line-height: 1.25">The board was not built</h1>
<p style="margin: 0 0 12px">This cfo.exe was built from a checkout whose board was never built, so it carries this page in place of the board.</p>
<p style="margin: 0; color: #a3b3c2">In that checkout, run <code>npm ci</code> and then <code>npm run build</code> in the <code>frontend</code> folder, then build cfo.exe again.</p>
