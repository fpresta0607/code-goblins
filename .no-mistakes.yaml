# This repository's settings for the no-mistakes gate, the local pipeline
# (review, test, document, lint, push, PR, CI) every change here passes
# through before it merges. The gate reads this file from the default branch.
# It exists for two reasons: gate agents must never load AGENTS.md or
# CLAUDE.md, and automatic fix rounds stay bounded. docs/load-map.md places
# it among everything else the gate's agents read.

# AGENTS.md installs a CFO identity. Disable project-level agent settings and
# instructions for gate agents so a no-mistakes review/fix/document/test/lint
# agent never adopts that identity or drives the fleet.
disable_project_settings: true

# Gate steps run inside a goblin pane, which exports CFO_HOME and
# CFO_STATE_OVERRIDE so `cfo` reaches the fleet from a worktree. A step that
# runs `cfo` or `go test` without clearing both writes into the RUNNING fleet:
# on 2026-09-08 a test step's end-to-end `cfo notify` put a synthetic status
# file and two wake records into the live queue. internal/home refuses the
# inherited home from a test binary, which covers `go test`; the real `cfo`
# binary is not a test binary, so a step that invokes it must clear both
# variables itself. no-mistakes v1.75.1 has no per-repo step command or env
# setting to enforce this, so it is stated in every intent instead.

# This repository does not override the primary pipeline agent.
# The owned global Codex profile routes test, document, and lint, while global
# review_agents independently pin review and review-fix to that same profile.

# These committed overrides also bound a new gate during the initial rollout.
# Shared machine settings are rendered only in an explicit idle window.
# CI auto-fix is off in code-goblins, and must stay off: a repository gate can
# run only after rebase, review, test, document or lint, so a no-mistakes(ci)
# fix that deleted or skipped a test would ship unchecked by the tests-kept
# gate below. A CI failure goes back to the goblin, whose own fix is gated
# again. cfo pipeline run accepts this because a repository may lower an
# automatic fix below the frozen policy, never raise one.
auto_fix:
  review: 0
  test: 1
  lint: 1
  rebase: 1
  ci: 0

# A gate fix must never delete or skip a test unseen: on 2026-09-24 a test
# step fixed a failing test on PrecisionDocs #1272 by deleting it, and no
# review saw it. After lint, the last fixing step a gate can follow, this gate
# fails when the pipeline's own commits (subject no-mistakes(<step>): ...)
# deleted a test that HEAD still lacks, or added more skip lines to a test
# file than they removed while HEAD still has skips there (counted per gate
# commit, so a reworded or moved skip still shows and a merged main never
# counts), which parks the run with an ask-user
# finding: approve accepts it, fix restores the test. It
# reads every gate commit since the merge base, so a later gate run on a branch
# whose gate deletion was already approved parks again, and approving again
# clears it. It runs the installed cfo, the trusted binary, so it works once
# the CFO installs a build that has `cfo gate`.
gates:
  - name: tests-kept
    after: lint
    command: "cfo gate tests-kept"
