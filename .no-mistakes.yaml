# This repository's settings for the no-mistakes gate, the local pipeline
# (review, test, document, lint, push, PR, CI) every change here passes
# through before it merges. The gate reads this file from the default branch.
# It exists for four reasons: gate agents must never load AGENTS.md or
# CLAUDE.md, automatic fix rounds stay bounded, the review step asks
# whether a change is reached by its tests through the real caller, and the
# rebase step never rewrites a published branch.
# docs/load-map.md places it among everything else the gate's agents read.

# AGENTS.md installs a CEO identity. Disable project-level agent settings and
# instructions for gate agents so a no-mistakes review/fix/document/test/lint
# agent never adopts that identity or drives the fleet.
disable_project_settings: true

# Gate steps run inside a goblin pane, which exports GOBLINS_HOME and
# GOBLINS_STATE_OVERRIDE so `goblins` reaches the fleet from a worktree. A step that
# runs `goblins` or `go test` without clearing both writes into the RUNNING fleet:
# on 2026-09-08 a test step's end-to-end `goblins notify` put a synthetic status
# file and two wake records into the live queue. internal/home refuses the
# inherited home from a test binary, which covers `go test`; the real `goblins`
# binary is not a test binary, so a step that invokes it must clear both
# variables itself. The test step's baseline command below clears them in
# code; no-mistakes v1.75.1 has no per-repo env setting, so for everything an
# agent runs it is stated in every intent instead.

# The test step's baseline is `goblins gate test`, which with no level runs the
# fast level: go vet on every package the branch's change reaches, each named
# with why, and the tests of the changed packages config/verify.json does not
# list as slow. The gate's ci step then waits for CI, which runs every
# package, so CI is the check of the affected level the change requires;
# running that level here as well took a median of 33 minutes on this loaded
# machine and ran the slowest packages twice. An agent-chosen step ran the
# whole suite here, where supervisor alone takes about 22 minutes, and hit
# the 30-minute test agent limit with no failing test. It runs the installed
# goblins, so activation needs an installed build with both `goblins gate test` and
# `goblins gate prepare` after this configuration lands on the default branch.
#
# The lint step reuses the affected-check planner for go vet, without running
# tests again. Unknown changes keep its full-tree fallback. Native preparation
# installs the frontend lock in this validation worktree before Test only when
# the scoped planner sees frontend changes. Go-only and documentation-only
# changes install nothing. CI's frontend job retains its broader checks.
commands:
  prepare: "goblins gate prepare"
  test: "goblins gate test"
  test_focused: "goblins gate test --focused"
  lint: "goblins gate lint"

test:
  instructions: |
    Use the repository environment and existing fixtures for the changed surface.
    CONTRIBUTING.md describes the existing Go, frontend and acceptance-test prerequisites.
    Exercise changed behavior with the existing package fixtures and fake runners; these do not require a board build or live harness sessions.
    Keep required guards inside commands.test and run its baseline once; commands.test_focused reads NO_MISTAKES_TEST_FOCUS as a UTF-8 filename containing data, never shell code.
    A repair checks every named failure and the packages affected by its repaired paths, including transitive dependents.
    Live terminal and browser journeys require their existing executable, input and environment fixtures.
    When a prerequisite is unavailable, record the scenario as untested and name the missing prerequisite, without inventing or building a disposable full application.
    CI owns the broader package coverage and platform checks that the local plan explicitly defers.

# The review step asks the one question about a change's tests that this
# repository keeps answering too late: whether they reach the changed code
# through its real caller. Adapted, in this repository's own words, from the
# ECC library's test-analysis idea at affaan-m/ecc commit
# d2ef2680594f9a17526a6e1a2e18b3d242c5d17b: agents/pr-test-analyzer.md, and
# skills/ai-regression-testing/SKILL.md with the review material beside it,
# rules/common/code-review.md. No ECC script, hook or workflow runs here.
#
# The rule fires only for the paths a change actually touches, and adds to the
# reviewer's own requirements instead of replacing them. On 2026-11-07 the same
# class of finding arrived in the last review round, after the repair budget
# was spent, twice: typedFrom-wiring-untested on cg-chat-menus-and-send-now,
# and the three unix-guard findings on root-no-mistakes-143.
#
# Like test.instructions above and review.conversation, path_instructions is
# honoured only from the default branch, so this block steers a review once it
# is merged there; a pushed branch cannot add or weaken the rules that review
# it.
#
# The gate matches one glob per entry and no brace expansion, so the same text
# is stated once per source extension; change all three together.
review:
  path_instructions:
    - path: "*.go"
      instructions: |
        Check that new and changed code paths are reached by a test through their real caller.
        For every function, guard, branch, value or field the change adds, moves or narrows, name the production code that reaches it and the test that enters there, and open both.
        A test that calls the changed function directly proves the function, not the wiring: it passes unchanged with the call site deleted, wired to the wrong value or made unreachable.
        A removed or narrowed guard must still fail something: name the test that fails without it, and report a guard whose removal leaves every test passing.
        Both times a change here slipped through with untested wiring, it was this seam: a typed value handed to one component and tested at another, and a unix guard that selected the wrong shell while its own test asserted the selection.
        A unit test of a decision helper is evidence for the helper alone; the seam to prove is the gate step, board view or command that calls it, and the assertion must differ observably on each side of that path.
        Report the untested path as the finding, naming the caller and the assertion the missing test needs.
    - path: "*.ts"
      instructions: |
        Check that new and changed code paths are reached by a test through their real caller.
        For every function, guard, branch, value or field the change adds, moves or narrows, name the production code that reaches it and the test that enters there, and open both.
        A test that calls the changed function directly proves the function, not the wiring: it passes unchanged with the call site deleted, wired to the wrong value or made unreachable.
        A removed or narrowed guard must still fail something: name the test that fails without it, and report a guard whose removal leaves every test passing.
        Both times a change here slipped through with untested wiring, it was this seam: a typed value handed to one component and tested at another, and a unix guard that selected the wrong shell while its own test asserted the selection.
        A unit test of a decision helper is evidence for the helper alone; the seam to prove is the gate step, board view or command that calls it, and the assertion must differ observably on each side of that path.
        Report the untested path as the finding, naming the caller and the assertion the missing test needs.
    - path: "*.tsx"
      instructions: |
        Check that new and changed code paths are reached by a test through their real caller.
        For every function, guard, branch, value or field the change adds, moves or narrows, name the production code that reaches it and the test that enters there, and open both.
        A test that calls the changed function directly proves the function, not the wiring: it passes unchanged with the call site deleted, wired to the wrong value or made unreachable.
        A removed or narrowed guard must still fail something: name the test that fails without it, and report a guard whose removal leaves every test passing.
        Both times a change here slipped through with untested wiring, it was this seam: a typed value handed to one component and tested at another, and a unix guard that selected the wrong shell while its own test asserted the selection.
        A unit test of a decision helper is evidence for the helper alone; the seam to prove is the gate step, board view or command that calls it, and the assertion must differ observably on each side of that path.
        Report the untested path as the finding, naming the caller and the assertion the missing test needs.

# This repository does not override the primary pipeline agent.
# Under pipeline policy version 5 every gate role runs the owned global chain,
# Codex first and Claude next, with no review role pinned outside it. Under
# version 6 every gate role runs on the harness its task's goblin runs on.

# Shared machine settings are rendered only in an explicit idle window.
# This file names no test or lint count, so the machine's own governs each:
# one automatic follow-up under pipeline policy version 6, and none from
# version 7, where a Test or Lint failure goes back to the goblin that owns
# the branch. A count here above the task's frozen policy refuses the run.
# CI auto-fix is off in code-goblins, and must stay off: a repository gate can
# run only after rebase, review, test, document or lint, so a no-mistakes(ci)
# fix that deleted or skipped a test would ship unchecked by the tests-kept
# gate below. A CI failure goes back to the goblin, whose own fix is gated
# again. goblins pipeline run accepts this because a repository may lower an
# automatic fix below the frozen policy, never raise one.
auto_fix:
  review: 0
  rebase: 1
  ci: 0

# A goblin keeps a published pull request current by merging main in, since
# published commits are never rebased or force-pushed. The rebase step's
# default strategy replays the branch onto main, which drops the resolution
# that merge carried: on 2026-11-02 two fresh runs conflicted on README.md
# while the branch head merged cleanly with main, and the only fix the gate
# offered rewrote the published commits (issue 1949). Merging main in keeps
# the reviewed head as the first parent, so publication is a fast-forward,
# and a real conflict with main still stops the run. The gate reads this only
# from the default branch.
rebase:
  strategy: merge

# A gate fix must never delete or skip a test unseen: on 2026-09-24 a test
# step fixed a failing test on PrecisionDocs #1272 by deleting it, and no
# review saw it. After lint, the last fixing step a gate can follow, this gate
# fails when the pipeline's own commits (subject no-mistakes(<step>): ...)
# deleted a test that HEAD still lacks, or added more skip lines to a test
# file than they removed while HEAD still has their skips there (counted per
# gate commit, so a reworded or moved skip still shows and a merged main never
# counts), which parks the run with an ask-user finding: approve accepts it,
# fix restores the test. A gate commit under the head of an earlier park a
# person approved or skipped, read from the gate's database, is left out on
# any branch carrying it; one the rebase step rewrote after the approval is a
# new commit and parks once more. It runs the installed goblins, the trusted
# binary, so it works once the CEO installs a build that has `goblins gate`.
gates:
  - name: tests-kept
    after: lint
    command: "goblins gate tests-kept"
