# Per-repo no-mistakes overrides.

# AGENTS.md installs a CFO identity. Disable project-level agent settings and
# instructions for gate agents so a no-mistakes review/fix/document/test/lint
# agent never adopts that identity or drives the fleet.
disable_project_settings: true

# The approved reviewer stays Claude Opus high; shared model/effort settings
# come from config/pipeline.json through the explicit idle config-apply command.
agent: [claude]

# These committed overrides also bound a new gate during the initial rollout.
# Shared machine settings are rendered only in an explicit idle window.
auto_fix:
  review: 0
  test: 1
  lint: 1
  rebase: 1
  ci: 1
